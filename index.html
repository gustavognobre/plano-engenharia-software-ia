:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#182536;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}a{color:#155b9a}a:hover{text-decoration:underline}.app{display:grid;grid-template-columns:285px minmax(0,1fr);min-height:100vh}.side{background:#12243d;color:#eaf1fb;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:1.12rem;font-weight:750;margin:0 9px 6px}.sub{font-size:.84rem;color:#a7bed9;margin:0 9px 20px}.search{width:100%;padding:11px;border-radius:10px;border:1px solid #51708f;background:#1c3452;color:white;margin-bottom:16px}.navbtn{display:block;width:100%;padding:11px 12px;text-align:left;background:none;color:#dfe9f7;border:0;border-radius:10px;cursor:pointer;line-height:1.4;margin-bottom:3px}.navbtn:hover,.navbtn.active{background:#30577e;color:white}.navbtn small{display:block;opacity:.7}.main{padding:35px clamp(18px,5vw,75px) 80px;max-width:1130px;width:100%;margin:auto}.topline{color:#496988;font-size:.88rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}.intro{font-size:1.08rem;line-height:1.7}.card{background:white;border:1px solid #e1e7ef;border-radius:16px;padding:24px;margin:19px 0;box-shadow:0 3px 15px #152f4810}.card h2{font-size:1.35rem;margin-top:0}.card h3{font-size:1.02rem}.bodytext{line-height:1.75}.example{background:#eef5fb;border-left:4px solid #3779ad;border-radius:5px;padding:12px 15px;line-height:1.6}.video{display:grid;grid-template-columns:minmax(230px,1fr) minmax(270px,1.15fr);gap:20px;background:#f3f7fb;border-radius:12px;padding:16px;margin-top:18px}.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:9px;background:#172c43}.script{line-height:1.7}.script strong{color:#155b9a}.muted{color:#5b6d7e}.pill{display:inline-block;background:#e1edfb;color:#17456d;padding:5px 10px;border-radius:20px;font-size:.82rem}.controls{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.controls button,.mobileMenu{background:#17466e;color:white;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.controls button:disabled{opacity:.4;cursor:default}.mobileMenu{display:none}.qa details{border-top:1px solid #e2e8f0;padding:12px 0}.qa summary{cursor:pointer;font-weight:600}.qa p{line-height:1.65}.refs li,.tasks li{margin:9px 0;line-height:1.6}.notice{font-size:.9rem;color:#587084}.empty{color:#b8cce0;padding:8px}.sr-only{position:absolute;left:-9999px}@media(max-width:850px){.app{display:block}.mobileMenu{display:inline-block;position:sticky;top:8px;z-index:4;margin:8px}.side{position:fixed;z-index:5;left:0;transform:translateX(-100%);transition:transform .2s;width:min(330px,88vw);box-shadow:5px 0 25px #0004}.side.open{transform:none}.main{padding:18px 20px 70px}.video{grid-template-columns:1fr}}@media print{.side,.controls,.mobileMenu{display:none}.app{display:block}.main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}.video iframe{display:none}.qa details:not([open])>*{display:block}body{background:white}}
</style></head><body><button class="mobileMenu" id="menu" aria-label="Abrir módulos">☰ Módulos</button><div class="app"><aside class="side" id="side"><div class="brand">Engenharia de software com IA</div><p class="sub">13 módulos • leitura e vídeos • navegação local</p><label class="sr-only" for="search">Buscar módulo</label><input id="search" class="search" placeholder="Buscar módulo..." autocomplete="off"><nav id="nav" aria-label="Módulos"></nav><p class="notice">O roteiro é um texto autoral equivalente para estudo, não uma transcrição dos vídeos.</p></aside><main class="main" id="content" tabindex="-1"></main></div><script id="course" type="application/json">[{"id": "00", "slug": "00-python-git-e-ambiente", "title": "Python, Git e ambiente", "hours": "8 h", "phase": "Fundamentos", "goal": "Qualidade: Git, commits pequenos, pytest e depuração; um teste descreve o comportamento esperado.", "deliverable": "Criar um programa de terminal que recebe um texto, separa palavras, conta frequências e salva um JSON.", "steps": [["Python para transformar dados", "Em Python, uma variável guarda um valor, uma lista reúne valores em ordem e um dicionário associa uma chave a um valor. Para contar palavras, percorra os termos e atualize um dicionário: a palavra é a chave e sua frequência é o valor. Coloque essa transformação em uma função que recebe texto e devolve contagens; trate texto vazio e defina como lidar com maiúsculas e pontuação.", "Entrada: “IA ajuda. IA testa.” → normalização → {\"ia\": 2, \"ajuda\": 1, \"testa\": 1}."], ["Ambiente e organização", "Crie um ambiente virtual por projeto para instalar dependências sem misturar versões com outros trabalhos. Um README explica como executar; um arquivo .env.example lista nomes de variáveis esperadas, sem incluir segredos. Use o terminal para executar o programa, instalar bibliotecas e conferir os arquivos produzidos.", "Fluxo: texto de entrada → função de contagem → arquivo JSON; um JSON válido pode ser aberto e lido novamente."], ["Git e verificação", "Separe alterações em commits pequenos e leia git status e git diff antes de registrar cada uma. Escreva testes para uma frase normal, entrada vazia e palavras repetidas; pytest executa os casos e mostra onde o resultado divergiu. Testes capturam erros no comportamento definido, mas exigem que você escolha bons casos.", "Exemplo: texto vazio deve produzir {} e não lançar exceção inesperada."]], "videos": [{"title": "Python para começar, Curso em Vídeo", "url": "https://www.youtube.com/watch?v=S9uPNppGsGo", "id": "S9uPNppGsGo", "stage": 0, "script": "Leia o exemplo de contagem em voz alta. Defina texto, liste as palavras e explique que o dicionário guarda quantas vezes cada termo apareceu. Execute mentalmente a entrada curta e explique como o resultado se torna JSON. Termine apontando os casos texto vazio e pontuação."}, {"title": "Primeiros comandos em Python", "url": "https://www.youtube.com/watch?v=31llNGKWDdo", "id": "31llNGKWDdo", "stage": 0, "script": "Abra o terminal, execute um comando Python simples e observe a saída. Explique a diferença entre escrever uma expressão, criar uma variável e chamar uma função. Crie uma função que recebe texto e devolve uma contagem; repita com entrada vazia."}], "exercises": ["Criar um programa de terminal que recebe um texto, separa palavras, conta frequências e salva um JSON.", "Isolar a contagem em função pura; testar texto vazio, pontuação e repetição."], "qa": [["Por que usar venv?", "Para isolar dependências de cada projeto."], ["O que um teste de caso vazio verifica?", "O comportamento da função quando não há entrada."], ["Por que não commitar .env?", "Porque pode conter credenciais."], ["O que é uma função pura?", "Mesma entrada produz mesma saída sem alterar estado externo."], ["Como consultar alterações antes de um commit?", "Usar git diff e git status."], ["Qual estrutura associa palavra e contagem?", "Um dicionário."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.python.org/pt-br/3/tutorial/", "https://docs.pytest.org/"]}, {"id": "01", "slug": "01-engenharia-de-software-com-ia", "title": "Engenharia de software com IA", "hours": "8 h", "phase": "Fundamentos", "goal": "Entrega: testes automatizados, revisão humana, registro de decisões, acessibilidade básica e versionamento.", "deliverable": "Especificar um portal de perguntas sobre documentação interna com três jornadas: publicar, perguntar e revisar resposta.", "steps": [["Problema, usuário e escopo", "Comece descrevendo quem precisa da solução, o problema observado e a primeira tarefa que precisa funcionar. Uma jornada mostra o caminho do usuário; um critério de aceite descreve uma entrada e o resultado observável. Limites explícitos evitam prometer busca em documentos que ainda não foram indexados.", "Critério: ao perguntar sobre uma regra inexistente, o portal informa que não encontrou evidência."], ["Construção assistida por IA", "Divida a implementação em tarefas verificáveis, como criar o formulário, validar o campo e exibir a resposta. Dê à IA o contexto mínimo necessário e peça uma mudança por vez. Compare o código proposto com o código anterior e procure alterações inesperadas em permissões, dependências ou outros fluxos.", "Peça uma interface para perguntar; depois verifique se o formulário bloqueia pergunta vazia."], ["Revisão e entrega", "Teste critérios de aceite, revise o diff e registre decisões técnicas. Verifique uso básico por teclado e leitura dos rótulos da interface. Uma entrega demonstra comportamento reproduzível, inclusive falha tratada, e registra o que ainda depende de implementação.", "Se a consulta falhar, a interface mostra uma mensagem compreensível e permite tentar novamente."]], "videos": [{"title": "Prompts na prática, referência da UNIPDS", "url": "https://youtu.be/ysPbXH0LpIE", "id": "ysPbXH0LpIE", "stage": 1, "script": "Apresente o problema do portal e uma jornada concreta. Transforme a jornada em critério verificável, peça à IA uma mudança pequena na interface e leia o diff. Termine explicando como identificar um erro gerado e como comprovar a correção."}], "exercises": ["Especificar um portal de perguntas sobre documentação interna com três jornadas: publicar, perguntar e revisar resposta.", "Implementar uma pequena interface com IA assistindo; registrar três erros encontrados na revisão."], "qa": [["O que distingue critério de aceite de uma ideia?", "Critério é verificável com cenário e resultado esperado."], ["Por que dividir prompts por tarefa?", "Facilita revisão e localização de regressões."], ["O que revisar antes de aceitar código gerado?", "Comportamento, segurança, testes, dependências e diff."], ["Quem decide o escopo?", "A pessoa responsável pelo produto."], ["Por que usar Git em prototipagem rápida?", "Para manter histórico e poder revisar e reverter mudanças."], ["Que artefato descreve a experiência de um usuário?", "Uma jornada com passos e resultados esperados."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://www.asimov.academy/trilhas/vibe-coding/", "https://github.com/unipds-engenharia-de-ia-aplicada/engenharia-de-software-com-ia-aplicada"]}, {"id": "02", "slug": "02-fundamentos-llm-e-prompts", "title": "LLMs, tokens e prompts", "hours": "10 h", "phase": "Fundamentos", "goal": "Experimento: comparar respostas em 20 casos, medir formato, correção, custo e latência.", "deliverable": "Construir 20 exemplos de classificação de mensagens por intenção e um prompt com saída JSON.", "steps": [["Como um modelo de linguagem responde", "O modelo recebe uma sequência de tokens e prevê continuações conforme padrões aprendidos. A janela de contexto limita o que ele pode considerar em uma chamada; temperatura influencia a variação das respostas, mas não corrige fatos. Embeddings são vetores usados para comparar semelhança entre textos, úteis na recuperação de documentos.", "Para classificar mensagens, defina as categorias antes de pedir uma resposta ao modelo."], ["Instrução, exemplos e saída", "Um prompt útil separa tarefa, dados recebidos, regras e formato esperado. Exemplos mostram casos difíceis; um esquema JSON reduz ambiguidade para o código consumidor. Trate texto de usuário e documentos como dados, não como comandos para mudar as regras do sistema.", "Saída desejada: {\"intencao\":\"suporte\",\"confianca\":\"alta\"}; valide as chaves antes de usar."], ["Comparação controlada", "Monte 20 mensagens rotuladas antes do experimento. Rode as mesmas entradas com prompt sem exemplos e com exemplos; conte acertos, respostas fora do esquema, tempo e tokens. Guarde os erros para decidir se vale mudar instrução, exemplos ou arquitetura.", "Se um prompt acerta 16/20 e outro 18/20, examine também os dois erros restantes e o custo."]], "videos": [{"title": "Transformers e embeddings, seleção da UNIPDS", "url": "https://www.youtube.com/watch?v=ynNDmp7hBdo", "id": "ynNDmp7hBdo", "stage": 0, "script": "Mostre que texto vira tokens e que embeddings aproximam significados para busca. Compare duas perguntas parecidas e explique por que recuperar um trecho relevante não garante, por si só, uma resposta correta."}, {"title": "Prompt engineering, seleção da UNIPDS", "url": "https://youtu.be/ysPbXH0LpIE", "id": "ysPbXH0LpIE", "stage": 1, "script": "Escreva uma instrução com tarefa, categorias e JSON esperado. Compare uma versão sem exemplos e outra com exemplos usando as mesmas mensagens. Explique o que medir e como tratar texto externo como dado."}], "exercises": ["Construir 20 exemplos de classificação de mensagens por intenção e um prompt com saída JSON.", "Comparar prompt zero shot e few shot; anotar erros e custos por exemplo."], "qa": [["O que é um token?", "Unidade de texto usada pelo modelo para entrada e saída."], ["Embeddings substituem a resposta final?", "Não; representam dados para comparação e recuperação."], ["Por que saída estruturada?", "Facilita validação e consumo por código."], ["Temperatura alta garante criatividade útil?", "Não; altera a amostragem e pode elevar variabilidade."], ["Qual é o risco de tratar texto recuperado como instrução?", "Prompt injection."], ["Como medir melhoria de prompt?", "Comparar os mesmos casos e métricas antes e depois."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/", "https://huggingface.co/learn/llm-course/"]}, {"id": "03", "slug": "03-apis-e-apps-inteligentes", "title": "APIs e aplicativos inteligentes", "hours": "10 h", "phase": "Fundamentos", "goal": "Entrega: criar API FastAPI, interface simples, logs sem dados privados e orçamento de tokens.", "deliverable": "Criar API /classificar que chama um modelo por adaptador e devolve JSON validado; incluir um modo mock sem chave.", "steps": [["HTTP e provedores", "Uma API recebe uma requisição e devolve uma resposta com status e corpo. Isole a chamada ao modelo em um adaptador: a regra de classificação não deve depender diretamente do formato de um provedor. Guarde chaves em variável de ambiente; trate timeout, resposta inválida e limite de uso.", "POST /classificar recebe uma mensagem e devolve intenção validada em JSON."], ["Camadas da aplicação", "A interface coleta a pergunta, a rota valida a entrada, o serviço executa a tarefa e o adaptador conversa com o modelo ou com um mock. Essa separação permite testar sem gastar chamadas pagas e trocar a implementação do provedor depois. Valide também a saída antes de mostrá-la.", "Um modo mock devolve uma intenção conhecida para testar formulário e rota sem chave."], ["Falhas e orçamento", "Defina tempo limite e tentativas limitadas apenas para operações em que repetir é seguro. Mostre ao usuário uma mensagem útil quando houver falha e registre logs sem texto privado ou credenciais. Estime tokens por chamada e um limite de gasto para evitar uso inesperado.", "Teste o caso em que o provedor demora demais e o caso em que devolve JSON inválido."]], "videos": [{"title": "FastAPI para iniciantes", "url": "https://www.youtube.com/watch?v=BtIy2aD8k_w", "id": "BtIy2aD8k_w", "stage": 1, "script": "Apresente o caminho formulário → rota HTTP → serviço → provedor. Demonstre uma requisição válida e uma inválida, explique status e validação. Substitua o provedor por mock e descreva timeout, erro e uso de chave por variável de ambiente."}], "exercises": ["Criar API /classificar que chama um modelo por adaptador e devolve JSON validado; incluir um modo mock sem chave.", "Criar interface com formulário e testar erro de timeout e JSON inválido."], "qa": [["Por que separar adaptador do provedor?", "Para trocar modelo sem alterar a lógica do produto."], ["O que fazer com timeout?", "Tratar a falha, aplicar retry limitado quando seguro e informar o usuário."], ["Onde guardar a API key?", "Em variável de ambiente ou gerenciador de segredos."], ["Qual vantagem do mock?", "Testar fluxo sem chamada paga ou rede."], ["Por que validar a saída?", "O modelo pode descumprir o formato solicitado."], ["O que registrar em produção?", "Evento, duração, erro e uso, sem vazar dados sensíveis."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://fastapi.tiangolo.com/tutorial/", "https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/"]}, {"id": "04", "slug": "04-rag-busca-e-citacoes", "title": "RAG: busca, recuperação e citações", "hours": "14 h", "phase": "Construção", "goal": "Resposta: citar trecho e origem, admitir ausência de evidência e testar recuperação separada da geração.", "deliverable": "Montar base com 10 documentos públicos e 20 perguntas com trechos de referência.", "steps": [["Preparação dos documentos", "RAG adiciona trechos recuperados ao contexto de uma resposta. Colete apenas documentos permitidos, extraia texto, divida em partes que mantenham sentido e guarde título, origem, versão e regras de acesso. Uma citação precisa permitir reencontrar o trecho original.", "Documento “Política de férias”, versão 2 → trechos numerados com título e origem."], ["Recuperação da evidência", "Comece por busca de termos e compare com embeddings em perguntas reais. Busca híbrida combina pistas lexicais e semânticas; filtros impedem recuperar material sem acesso autorizado. Em recall@k, conte em quantas perguntas o trecho correto aparece entre os k primeiros resultados.", "Se em 16 de 20 perguntas o trecho correto aparece no top 5, recall@5 = 80%."], ["Resposta citada e ausência de prova", "Passe ao modelo apenas trechos autorizados; peça afirmações sustentadas por citações verificáveis. Compare primeiro a recuperação com o gabarito e depois a qualidade da resposta: uma resposta elegante pode estar baseada no trecho errado. Quando falta evidência, diga que não encontrou base suficiente.", "Pergunta fora dos 10 documentos deve receber indicação de ausência de evidência, sem inventar regra."]], "videos": [{"title": "RAG do zero, freeCodeCamp", "url": "https://www.youtube.com/watch?v=sVcwVQRHIc8", "id": "sVcwVQRHIc8", "stage": 0, "script": "Comece com um documento autorizado. Separe-o em trechos com origem, recupere candidatos para uma pergunta e peça resposta com citação. Mostre o caso sem evidência e a necessidade de dizer que não sabe."}, {"title": "RAG em produção, freeCodeCamp", "url": "https://www.youtube.com/watch?v=mHxLXzYjQRE", "id": "mHxLXzYjQRE", "stage": 1, "script": "Mostre 20 perguntas rotuladas. Compare busca lexical e busca por embeddings usando recall@k. Inspecione uma recuperação errada, acrescente filtro de acesso e valide se as citações sustentam as afirmações."}], "exercises": ["Montar base com 10 documentos públicos e 20 perguntas com trechos de referência.", "Comparar busca por palavras e embeddings usando recall@k; gerar resposta com fonte e recusa fundamentada quando faltar evidência."], "qa": [["O que o RAG altera?", "O contexto apresentado ao modelo na inferência, não os pesos do modelo."], ["Por que metadados?", "Para filtrar, citar origem e controlar versões e acesso."], ["O que mede recall@k?", "A fração de perguntas cujo trecho relevante aparece entre os k recuperados."], ["Quando começar por busca lexical?", "Quando documentos e termos exatos permitem uma base simples e barata."], ["O que fazer sem trecho confiável?", "Declarar insuficiência de evidência e não inventar citação."], ["Qual diferença entre falha de busca e falha de resposta?", "A primeira não encontra evidência; a segunda usa mal a evidência encontrada."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langchain/retrieval", "https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/"]}, {"id": "05", "slug": "05-agentes-e-ferramentas", "title": "Agentes e uso de ferramentas", "hours": "12 h", "phase": "Construção", "goal": "Confiabilidade: limite de passos, orçamento, confirmação para atos sensíveis e trilha de execução.", "deliverable": "Criar agente que consulta uma base de FAQs e calcula prazos; chamadas de escrita devem exigir confirmação simulada.", "steps": [["Quando usar um agente", "Um fluxo fixo segue etapas programadas; um agente escolhe a próxima ação conforme objetivo e observações. Defina ferramentas disponíveis, condição de término, quantidade máxima de passos e o que o agente deve fazer quando não tiver dados. Use autonomia somente onde escolhas variáveis realmente ajudam.", "Para prazo simples, uma função direta pode bastar; um agente pode escolher entre buscar FAQ e calcular data."], ["Ferramentas com contratos", "Cada ferramenta deve declarar entradas, resultados e erros de maneira clara. Separe leitura de operações que alteram dados, aplique permissões mínimas e valide argumentos antes da execução. O resultado de uma busca é dado externo e pode conter instruções maliciosas que não devem ganhar autoridade.", "buscar_faq(termo) lê documentos; criar_lembrete(data) exige confirmação antes de escrever."], ["Limites e rastreabilidade", "Teste loops, retorno vazio e tentativa de induzir o agente por texto de documentos. Registre chamadas de ferramenta, decisões e custo sem expor conteúdo sensível. Limites de passos e aprovação para efeitos externos tornam possível interromper uma execução indevida.", "Um documento que pede “ignore as regras” deve ser tratado como conteúdo da busca."]], "videos": [{"title": "Agentes com Python e LangGraph", "url": "https://www.youtube.com/watch?v=PqS1kib7RTw", "id": "PqS1kib7RTw", "stage": 1, "script": "Desenhe objetivo, ferramentas e limite de passos. Para uma pergunta, mostre o agente escolhendo consultar FAQ e, se necessário, calcular prazo. Explique diferença entre leitura e escrita, confirmação e como interromper loop ou instrução maliciosa."}], "exercises": ["Criar agente que consulta uma base de FAQs e calcula prazos; chamadas de escrita devem exigir confirmação simulada.", "Testar 10 pedidos incluindo instrução maliciosa dentro de um documento e loop de chamadas."], "qa": [["Quando um workflow basta?", "Quando a sequência de passos é fixa e previsível."], ["O que o agente acrescenta?", "Escolha dinâmica de ações a partir do objetivo e observações."], ["Por que limite de passos?", "Para conter loops, custo e efeitos não desejados."], ["O que deve ter uma ferramenta?", "Contrato claro, validação, permissões mínimas e tratamento de erro."], ["Por que separar leitura e escrita?", "A escrita modifica estado e exige controle mais rigoroso."], ["O que é condição de parada?", "Regra para encerrar após resposta ou limite."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langchain/agents", "https://www.asimov.academy/trilhas/hermes-agent/"]}, {"id": "06", "slug": "06-mcp-protocolo-e-integracoes", "title": "MCP: protocolo e integrações", "hours": "12 h", "phase": "Construção", "goal": "Controle: autorização, escopo, revisão de servidores, auditoria e tratamento de dados enviados a ferramentas.", "deliverable": "Criar servidor MCP com tool buscar_item e resource catálogo usando SDK oficial; conectar a cliente compatível.", "steps": [["Arquitetura MCP", "No MCP, um host usa um cliente para se conectar a um servidor que oferece capacidades. Tools executam funções, resources disponibilizam dados e prompts oferecem modelos reutilizáveis. O protocolo organiza descoberta e chamada; a lógica real da consulta ainda precisa ser implementada e autorizada.", "Servidor de catálogo oferece tool buscar_item e resource com dados públicos do catálogo."], ["Servidor e cliente", "Defina um esquema para os argumentos da ferramenta e devolva erros claros para entrada inválida ou item ausente. Execute o servidor com transporte adequado ao ambiente e teste a descoberta com um cliente compatível. Uma resposta previsível facilita integrar a capacidade ao assistente de documentação.", "buscar_item({\"id\":\"A1\"}) retorna nome e origem; ID ausente produz erro controlado."], ["Escopo e segurança", "Restrinja arquivos, dados e ações disponíveis ao servidor. Revise a origem de servidores conectados, credenciais e permissões de cada ferramenta. Registre o que foi chamado e garanta que o cliente não possa acessar itens fora do escopo autorizado.", "Teste pedido de item privado a partir de um cliente que só pode consultar itens públicos."]], "videos": [{"title": "Introdução oficial ao MCP, Anthropic", "url": "https://www.youtube.com/watch?v=CQywdSdi5iA", "id": "CQywdSdi5iA", "stage": 0, "script": "Apresente host, cliente e servidor. Explique as três capacidades MCP por exemplos: tool que procura item, resource que fornece catálogo e prompt reutilizável. Faça uma chamada conceitual com esquema de entrada e mostre erro de item inexistente e limite de acesso."}], "exercises": ["Criar servidor MCP com tool buscar_item e resource catálogo usando SDK oficial; conectar a cliente compatível.", "Testar argumentos inválidos, ausência de item e tentativa de acesso fora do escopo."], "qa": [["MCP substitui a API?", "Não; padroniza como o cliente descobre e usa capacidades expostas por servidores."], ["O que são tools?", "Ações invocáveis pelo cliente/modelo com contratos de entrada."], ["O que são resources?", "Dados que uma aplicação cliente pode carregar."], ["O que são prompts?", "Modelos de interação reutilizáveis."], ["Qual risco de servidor desconhecido?", "Acesso indevido ou exposição de dados e execução não pretendida."], ["Por que schema de argumentos?", "Para validar chamadas e documentar a interface."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://modelcontextprotocol.io/docs/learn/architecture", "https://py.sdk.modelcontextprotocol.io/get-started/first-steps/"]}, {"id": "07", "slug": "07-langgraph-orquestracao-e-estado", "title": "LangGraph: estado e orquestração", "hours": "14 h", "phase": "Construção", "goal": "Avaliação: testar rotas, falhas de ferramentas, retomada e condição de encerramento.", "deliverable": "Criar grafo triagem → busca → revisão → resposta com desvio quando a evidência for fraca.", "steps": [["Estado, nós e rotas", "Um grafo representa etapas como nós e transições como arestas; o estado carrega dados necessários durante a execução. Cada nó lê o estado e devolve atualizações. Arestas condicionais escolhem o próximo passo, por exemplo revisão humana quando a evidência é insuficiente.", "triagem → busca → revisão ou resposta, conforme a qualidade da evidência."], ["Retomada e aprovação", "Um checkpoint grava estado para continuar uma execução identificada por thread. Antes de retomar, defina quais efeitos podem ser repetidos: escrita duplicada precisa de chave de idempotência ou verificação prévia. Um ponto de aprovação permite interromper o fluxo antes de uma ação sensível.", "Ao retomar após aprovação, a mesma publicação não deve ocorrer duas vezes."], ["Testes do fluxo", "Teste cada rota com estados de exemplo: evidência boa, evidência fraca, erro de ferramenta e interrupção. Verifique onde o grafo termina e o que acontece quando a revisão rejeita a resposta. Logs de nós ajudam a entender o caminho percorrido.", "Uma pergunta sem trecho relevante deve seguir para revisão ou responder “não sei”."]], "videos": [{"title": "What is LangGraph?, canal oficial", "url": "https://www.youtube.com/watch?v=4iYOJ6gyQV4", "id": "4iYOJ6gyQV4", "stage": 0, "script": "Mostre estado inicial com pergunta, um nó de triagem, um nó de busca e uma rota de revisão. Atualize o estado após cada nó e explique por que a transição depende da evidência. Termine com checkpoint e retomada sem repetir uma escrita."}, {"title": "RAG avançado com LangGraph", "url": "https://www.youtube.com/watch?v=sVcwVQRHIc8", "id": "sVcwVQRHIc8", "stage": 1, "script": "Reaproveite o exemplo de busca do módulo RAG e represente-o como nós do grafo. Mostre rota de evidência fraca, revisão humana e teste de retomada. Observe que este roteiro é uma aplicação do conceito de grafo, independentemente do título do vídeo indicado."}], "exercises": ["Criar grafo triagem → busca → revisão → resposta com desvio quando a evidência for fraca.", "Adicionar checkpoint e ponto de aprovação simulado; testar retomada sem duplicar uma ação."], "qa": [["O que é estado no grafo?", "Dados compartilhados atualizados pelos nós da execução."], ["Para que serve aresta condicional?", "Escolher o próximo nó segundo uma condição explícita."], ["O que o checkpoint guarda?", "Estado para retomar execução em uma thread."], ["Por que idempotência?", "Para evitar duplicar efeitos quando uma etapa é repetida."], ["Onde colocar revisão humana?", "Antes de ações com impacto ou baixa confiança."], ["Quando LangGraph é útil?", "Quando há rotas, estado, pausas ou retomadas além de uma cadeia simples."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langgraph/overview", "https://docs.langchain.com/oss/python/langgraph/persistence"]}, {"id": "08", "slug": "08-hermes-e-openclaw", "title": "Hermes Agent e OpenClaw", "hours": "8 h", "phase": "Construção", "goal": "Segurança: limitar diretórios, segredos e integrações; exigir aprovação para envio externo e escrita.", "deliverable": "Especificar rotina de resumo de arquivos de teste locais em ambos os ambientes (ou em um deles).", "steps": [["Comparar agentes pessoais", "Observe workspace, memória, ferramentas, skills e canais de cada sistema usando arquivos de teste. Faça uma tabela do que cada ambiente lê, armazena e executa. A experiência varia conforme versão e configuração; confirme comandos de instalação na documentação atual antes de usar.", "Teste um resumo de três arquivos fictícios em diretório isolado."], ["Rotina automatizada", "Uma automação tem gatilho, entrada, processamento, saída e condição de parada. Configure uma rotina local de resumo e registre quando dispara, o que ela acessa, quanto custa e o que acontece quando a entrada está vazia. Separe o agendamento da liberdade de decidir ações durante a execução.", "Todo dia, resumir arquivos de teste novos; sem arquivos, registrar “nada a processar”."], ["Limites de acesso", "Permita acesso apenas à pasta de teste e evite inserir segredos em prompts ou logs. Envio externo e escrita exigem verificação explícita. Compare como cada sistema permite revisar memória, auditar execução e cancelar uma rotina.", "Um pedido para ler outra pasta deve falhar ou solicitar autorização antes de prosseguir."]], "videos": [{"title": "Tutorial Hermes Agent, português", "url": "https://www.youtube.com/watch?v=sYMG1JHaPJc", "id": "sYMG1JHaPJc", "stage": 0, "script": "Em ambiente isolado, liste workspace, memória, skills e ferramentas. Descreva uma automação de resumo de arquivos de teste, seu gatilho e como auditar o resultado. Antes de usar comandos de instalação, consulte documentação oficial atual."}, {"title": "Tutorial de OpenClaw para iniciantes, português", "url": "https://www.youtube.com/watch?v=qmP7WvbnQvI", "id": "qmP7WvbnQvI", "stage": 1, "script": "Compare a mesma rotina em OpenClaw: entrada, agendamento, diretório permitido, resultado e log. Mostre o caso em que a rotina tenta acessar outra pasta e como bloquear ou pedir autorização. Consulte a documentação oficial atual para passos de instalação."}], "exercises": ["Especificar rotina de resumo de arquivos de teste locais em ambos os ambientes (ou em um deles).", "Documentar instalação consultando instruções oficiais atuais e comparar controle de acesso, memória e manutenção."], "qa": [["O que é uma skill neste contexto?", "Um procedimento reutilizável para orientar a execução."], ["O que deve ser limitado no workspace?", "Arquivos, segredos e recursos que o agente pode acessar."], ["Qual diferença entre automação e autonomia?", "Automação dispara rotina; autonomia envolve decisões dentro de limites."], ["Por que iniciar com dados de teste?", "Para entender efeitos antes de acesso a contas ou dados reais."], ["Que pergunta fazer antes de conectar mensagens?", "Quais dados serão lidos e quais ações podem ser enviadas?"], ["Como comparar duas plataformas?", "Pelo mesmo cenário, permissões, custo, logs e resultado."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://www.asimov.academy/trilhas/hermes-agent/", "https://www.asimov.academy/trilhas/openclaw/"]}, {"id": "09", "slug": "09-avaliacao-seguranca-e-observabilidade", "title": "Avaliação, segurança e observabilidade", "hours": "12 h", "phase": "Produção", "goal": "Observabilidade: logs, traces, latência, custo por tarefa, taxa de falha e regressões.", "deliverable": "Criar conjunto de 30 questões rotuladas (incluindo 5 casos adversariais) e medir resultado antes/depois de uma mudança.", "steps": [["Avaliação repetível", "Crie perguntas com resposta esperada, trechos de referência e rubrica de avaliação. Mantenha um conjunto fixo para comparar versões; separe acerto da resposta, qualidade da citação e adequação de uma recusa. Revise manualmente amostras quando uma métrica automática for ambígua.", "Pergunta sem resposta no acervo é aprovada somente se o assistente reconhecer a lacuna."], ["Ameaças e permissões", "Prompt injection aparece quando um documento, página ou resultado de ferramenta tenta controlar o assistente. Verifique a autorização no servidor antes da recuperação de dados e novamente antes de ações. Teste vazamento entre usuários, entradas maliciosas e segredo acidental em logs.", "Documento de usuário A não pode aparecer em resposta para usuário B."], ["Traces e regressões", "Um trace registra as etapas de uma solicitação e seus tempos. Meça latência, falha, uso de tokens e custo por tarefa sem guardar dados privados desnecessários. Depois de qualquer mudança, execute o mesmo conjunto de avaliação para detectar melhorias e regressões.", "Antes/depois: acerto 21/30 → 24/30; confira quais três casos melhoraram e se outros pioraram."]], "videos": [{"title": "RAG em produção e observabilidade", "url": "https://www.youtube.com/watch?v=mHxLXzYjQRE", "id": "mHxLXzYjQRE", "stage": 2, "script": "Prepare um conjunto de perguntas e respostas de referência. Mostre uma execução completa com busca, resposta, citação, latência e custo. Compare uma mudança antes/depois, investigue erros e inclua um documento com tentativa de prompt injection."}], "exercises": ["Criar conjunto de 30 questões rotuladas (incluindo 5 casos adversariais) e medir resultado antes/depois de uma mudança.", "Adicionar trace sem conteúdo sensível e testes de acesso cruzado entre usuários."], "qa": [["Por que conjunto fixo de avaliação?", "Permite comparar versões no mesmo cenário."], ["O que é prompt injection?", "Instrução hostil inserida em dados menos confiáveis."], ["Qual métrica valida citação?", "Se o trecho citado sustenta diretamente a afirmação."], ["Por que medir custo por tarefa?", "Para projetar viabilidade e detectar desvios."], ["Como evitar vazamento entre usuários no RAG?", "Filtrar acesso antes da recuperação e verificar autorização."], ["O que fazer após uma regressão?", "Investigar casos falhos e reverter ou corrigir com evidência."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://genai.owasp.org/llm-top-10/", "https://docs.langchain.com/langsmith/evaluation"]}, {"id": "10", "slug": "10-fine-tuning-e-decisao", "title": "Fine tuning: quando fazer", "hours": "12 h", "phase": "Produção", "goal": "Experimento: estudar SFT com LoRA/QLoRA, licenças, custo de GPU, qualidade do dataset, overfitting e comparação com baseline.", "deliverable": "Criar tabela de decisão para cinco problemas: conhecimento atualizado, estilo, formato, ação externa e custo/latência.", "steps": [["Diagnosticar o problema", "Meça o sistema atual antes de mudar de técnica. Falta de informação atual e citável aponta para recuperação; necessidade de consultar ou alterar sistemas aponta para ferramenta. Ajuste prompt e validação primeiro quando o problema é formato ou instrução instável.", "Se a resposta depende de um regulamento alterado ontem, indexe e cite a versão atual."], ["Dados para ajuste fino", "Fine tuning supervisionado ensina padrões por exemplos de entrada e saída. Organize exemplos representativos, autorizados e revisados; separe treino, validação e teste por origem para reduzir vazamento. Um ajuste de comportamento não substitui uma fonte atualizada para fatos que mudam.", "Treine padrão de redação com casos fictícios; avalie em casos de origem diferente."], ["Experimento e decisão", "LoRA e QLoRA são formas de adaptar modelos com menor custo de recursos, mas ainda exigem ambiente e avaliação adequados. Compare baseline, prompt aprimorado e ajuste no mesmo teste, com qualidade, latência e custo total. Se não houver GPU ou dados suficientes, a entrega pode ser a decisão experimental fundamentada.", "Uma melhora pequena em formato pode não compensar treinamento e manutenção."]], "videos": [{"title": "Fine tuning e LoRA, introdução", "url": "https://www.youtube.com/watch?v=ug9el1OGGEw", "id": "ug9el1OGGEw", "stage": 2, "script": "Descreva quando faltam fatos, quando falta ferramenta e quando falta consistência de formato. Explique com exemplos o que um ajuste supervisionado aprende; separe dados de treino e teste. Compare ganho em qualidade com custo e mantenha decisão sem treino caso faltem recursos."}], "exercises": ["Criar tabela de decisão para cinco problemas: conhecimento atualizado, estilo, formato, ação externa e custo/latência.", "Preparar 50 pares fictícios licenciados; separar treino/validação/teste por origem; executar treino pequeno somente se houver GPU e avaliar contra prompt e RAG."], "qa": [["Quando RAG é primeira escolha?", "Quando a resposta depende de fatos/documentos atualizados e rastreáveis."], ["Quando ferramentas são primeira escolha?", "Quando o sistema precisa consultar ou alterar estado externo."], ["Quando fine tuning pode ajudar?", "Quando exemplos de qualidade ensinam comportamento repetível que prompts não estabilizaram."], ["Fine tuning insere fatos atualizados de forma confiável?", "Não; dados mudam e o modelo não garante citação ou atualização."], ["Por que separar teste por origem?", "Para reduzir vazamento de exemplos muito parecidos."], ["Qual decisão vem antes do treino?", "Comparar com baseline e definir métrica e ganho esperado."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://huggingface.co/docs/trl/sft_trainer", "https://huggingface.co/docs/trl/peft_integration"]}, {"id": "11", "slug": "11-deploy-llmops-e-custo", "title": "Deploy, LLMOps e custo", "hours": "10 h", "phase": "Produção", "goal": "Custo: tokens por tarefa, custo de busca e infraestrutura, latência p95, rollback e monitoramento.", "deliverable": "Empacotar a aplicação em container e criar pipeline que rode testes sem chave real.", "steps": [["Preparar para produção", "Empacote a aplicação de forma reproduzível, separe configuração por ambiente e execute testes de contrato na integração contínua. Não coloque chaves na imagem ou no repositório. Planeje rota de saúde e uma forma de voltar à versão anterior.", "O mesmo container executa localmente e no ambiente de demonstração com configurações diferentes."], ["Operar com limites", "Configure timeout, fila e limites por usuário para evitar saturação. Retry precisa ser controlado: repetir uma escrita sem idempotência pode duplicar efeitos. Versões de prompt, modelo e índice ajudam a explicar mudanças; cache requer política de atualização quando documentos mudam.", "Pedido duplicado de publicação recebe a mesma chave de operação, evitando duas gravações."], ["Medir custo e recuperação", "Some custo de entrada e saída do modelo, indexação, busca e infraestrutura. Meça latência p95 e taxa de erro por tipo; simule indisponibilidade do provedor e verifique o fallback. Estime orçamento por 1.000 requisições usando hipóteses explícitas, depois substitua por medidas reais.", "Se 1.000 chamadas consomem X tokens de entrada e Y de saída, calcule cada parcela com a tarifa vigente."]], "videos": [{"title": "RAG em produção, implantação e custo", "url": "https://www.youtube.com/watch?v=mHxLXzYjQRE", "id": "mHxLXzYjQRE", "stage": 2, "script": "Siga uma solicitação do container até a busca e o modelo. Mostre como medir tokens, tempo e erro; simule falha do provedor e indique fallback. Explique por que o custo por mil pedidos inclui busca e infraestrutura."}, {"title": "FastAPI básico", "url": "https://www.youtube.com/watch?v=BtIy2aD8k_w", "id": "BtIy2aD8k_w", "stage": 0, "script": "Apresente uma rota FastAPI já conhecida e seus testes de contrato. Empacote o serviço, configure segredos por ambiente e explique como o pipeline verifica a aplicação antes do deploy."}], "exercises": ["Empacotar a aplicação em container e criar pipeline que rode testes sem chave real.", "Simular falha de provedor, definir fallback e registrar orçamento por 1000 requisições."], "qa": [["O que CI deve verificar?", "Testes, lint e contratos relevantes antes da integração."], ["Por que versionar prompts?", "Para explicar mudanças e associar resultados a versões."], ["Quando retry é perigoso?", "Quando repete uma operação de escrita não idempotente."], ["O que é p95 de latência?", "Tempo abaixo do qual ficam 95% das solicitações."], ["Como evitar custo sem limite?", "Definir orçamento, limite de chamadas/tokens e alertas."], ["O que deve permitir rollback?", "Uma versão anterior verificável da aplicação e configuração."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.docker.com/get-started/", "https://docs.github.com/actions"]}, {"id": "12", "slug": "12-projeto-final", "title": "Projeto final: assistente de documentação", "hours": "16 h", "phase": "Produção", "goal": "Demonstração: testes, avaliação antes/depois, análise de risco, deploy demonstrável e relatório de decisão sobre fine tuning.", "deliverable": "Entregar aplicativo funcional que responde com fontes, diz quando não sabe e consulta um catálogo via MCP.", "steps": [["Planejar o assistente", "Escolha documentos públicos ou autorizados, descreva quem pode consultar cada um e defina jornadas: perguntar, encontrar fonte e revisar resposta. Escreva critérios de aceite para resposta citada, ausência de evidência e consulta ao catálogo. Estabeleça um orçamento e limites de acesso.", "“Quando não houver trecho pertinente, responder sem inventar e oferecer consulta às fontes”."], ["Integrar componentes", "Construa API e interface; indexe documentos e recupere trechos com metadados e citação. Exponha uma consulta de catálogo por MCP; use um grafo para triagem, busca, revisão humana quando necessária e resposta. Cada componente deve ter uma responsabilidade verificável.", "Pergunta → filtro de acesso → busca → avaliação de evidência → resposta citada ou revisão."], ["Demonstrar e avaliar", "Execute 30 perguntas fixas, incluindo casos adversariais e sem resposta. Mostre métricas antes e depois de uma alteração, explique falhas e demonstre retomada, custos e limitações. Registre por que fine tuning ajudaria ou não neste problema.", "Entregue aplicação executável, tabela de resultados, diagrama e demonstração curta."]], "videos": [{"title": "RAG do zero, revisão", "url": "https://www.youtube.com/watch?v=sVcwVQRHIc8", "id": "sVcwVQRHIc8", "stage": 1, "script": "Percorra o assistente final: documento, indexação, pergunta, trecho, citação e resposta. Demonstre a ausência de evidência e relate um erro encontrado no conjunto de avaliação."}, {"title": "LangGraph, revisão", "url": "https://www.youtube.com/watch?v=4iYOJ6gyQV4", "id": "4iYOJ6gyQV4", "stage": 1, "script": "Mostre a mesma pergunta no grafo: triagem, busca, revisão e resposta. Explique estado, rota condicional e checkpoint, e registre quando uma pessoa precisa aprovar o próximo passo."}], "exercises": ["Entregar aplicativo funcional que responde com fontes, diz quando não sabe e consulta um catálogo via MCP.", "Incluir 30 perguntas de avaliação, relatório de métricas, vídeo curto de demonstração e diagrama da arquitetura."], "qa": [["Qual é a evidência de que a resposta está fundamentada?", "Citação verificável de trecho pertinente."], ["Qual função do MCP no projeto?", "Expor a capacidade de consultar um catálogo ao agente."], ["Onde entra LangGraph?", "No fluxo com estados, rotas e revisão humana."], ["Que resultado justifica fine tuning?", "Ganho medido em comportamento-alvo frente a alternativas mais simples."], ["Que entregáveis permitem reproduzir a avaliação?", "Dataset de testes autorizado, rubrica, configuração e resultados."], ["Qual é o comportamento quando faltam fontes?", "Informar a limitação e não inventar conteúdo."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langgraph/overview", "https://modelcontextprotocol.io/docs/learn/architecture"]}]</script><script>
const course=JSON.parse(document.getElementById('course').textContent);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=course.findIndex(x=>x.id===location.hash.slice(1));if(current<0)current=0;
function nav(){let term=$('search').value.toLocaleLowerCase('pt-BR'),matches=course.filter(r=>(r.id+' '+r.title).toLocaleLowerCase('pt-BR').includes(term));$('nav').innerHTML=matches.map(r=>`<button class="navbtn ${r.id===course[current].id?'active':''}" data-id="${r.id}"><small>MÓDULO ${r.id} · ${esc(r.hours)}</small>${esc(r.title)}</button>`).join('')||'<p class="empty">Nenhum módulo encontrado.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{current=course.findIndex(x=>x.id===b.dataset.id);location.hash=b.dataset.id;render();$('side').classList.remove('open')})}
function render(){let r=course[current];document.title=`Módulo ${r.id} — ${r.title}`;let stage=r.steps.map((s,i)=>{let vids=r.videos.filter(v=>v.stage===i).map(v=>`<div class="video"><div><iframe loading="lazy" title="${esc(v.title)}" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(v.id)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe><p><a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${esc(v.title)} ↗</a></p></div><div class="script"><strong>Roteiro para ler no lugar do vídeo</strong><p>${esc(v.script)}</p><small class="muted">Texto autoral de estudo; não é transcrição nem resumo verificado do vídeo.</small></div></div>`).join('');return `<section class="card" id="etapa${i+1}"><span class="pill">Etapa ${i+1}</span><h2>${esc(s[0])}</h2><p class="bodytext">${esc(s[1])}</p><p class="example"><strong>Exemplo aplicado:</strong> ${esc(s[2])}</p>${vids}</section>`}).join('');$('content').innerHTML=`<div class="topline">${esc(r.phase)} · módulo ${r.id} · ${esc(r.hours)}</div><h1>${esc(r.title)}</h1><p class="intro">${esc(r.goal)}</p><p><strong>Entrega:</strong> ${esc(r.deliverable)}</p>${stage}<section class="card tasks"><h2>Prática guiada</h2><ol>${r.exercises.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p><strong>Para concluir:</strong> ${esc(r.criteria)}</p></section><section class="card qa"><h2>Revisão: responda antes de abrir</h2>${r.qa.map(([q,a],i)=>`<details><summary>${i+1}. ${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section><section class="card refs"><h2>Leituras de apoio</h2><ul>${r.refs.map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></li>`).join('')}</ul></section><p class="notice"><a href="roteiros/Modulo_${r.id}.docx" download>Baixar roteiro deste módulo em Word</a>. Os vídeos e as leituras externas precisam de internet.</p><div class="controls"><button id="prev" ${current===0?'disabled':''}>← Anterior</button><button id="next" ${current===course.length-1?'disabled':''}>Próximo →</button></div>`;$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);nav();window.scrollTo(0,0)}function go(delta){current=Math.max(0,Math.min(course.length-1,current+delta));location.hash=course[current].id;render()}$('search').oninput=nav;$('menu').onclick=()=>$('side').classList.toggle('open');window.addEventListener('hashchange',()=>{let i=course.findIndex(x=>x.id===location.hash.slice(1));if(i>=0&&i!==current){current=i;render()}});document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});render();
</script></body></html>
