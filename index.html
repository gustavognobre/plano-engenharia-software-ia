<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100f14">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Aplicação real de IA · Trilha de estudos</title>
<style>
:root {
  color-scheme: dark; --canvas:#100f14; --panel:#1a1820; --line:#38333f;
  --text:#faf7f5; --muted:#c1b8c3; --accent:#ff706d;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--canvas); color:var(--text);
}
*{box-sizing:border-box}
body{margin:0}
a{color:inherit}
button,input{font:inherit}
button,a,input{ -webkit-tap-highlight-color:transparent }
:focus-visible{outline:3px solid #ffc989;outline-offset:4px}
[hidden]{display:none!important}
p{margin:0 0 1em}
h1,h2,h3{margin:0}
.container{width:min(1280px,91vw);margin-inline:auto}
.top{position:relative;z-index:2;background:#100f14;border-bottom:1px solid #29252f}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:20px}
.brand,.navlink{text-decoration:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:760}
.mark{display:grid;place-items:center;background:var(--accent);color:#210e13;border-radius:8px;width:31px;height:31px;font-weight:900;font-size:.72rem}
.navlink{color:var(--muted);font-size:.9rem}
.hero{position:relative;isolation:isolate;overflow:hidden;background:
  linear-gradient(90deg,#100f14 0%,#100f14 16%,#191222 52%,#301925 100%);}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(transparent,var(--canvas));z-index:-1}
.hero-inner{min-height:435px;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding-block:45px 64px;gap:34px}
.hero-copy{max-width:620px}
.eyebrow{font-size:.75rem;font-weight:760;letter-spacing:.14em;text-transform:uppercase;color:#ffaba4;margin-bottom:13px}
.hero h1{font-size:clamp(2.8rem,6.8vw,5.8rem);font-weight:840;letter-spacing:-.085em;line-height:.95}
.hero h1 span{color:#ff9186}
.description{max-width:49ch;line-height:1.65;color:var(--muted);margin:22px 0}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.button{padding:11px 16px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;border:1px solid var(--line);border-radius:8px;font-weight:720;background:#25212b;color:var(--text)}
.button:hover{background:#3a303e}
.primary{color:#250d13;background:var(--accent);border-color:transparent}
.primary:hover{background:#ff9790}
.art{position:relative;justify-self:center;width:min(100%,455px);min-height:250px;border:1px solid #925560;border-radius:22px;background:radial-gradient(ellipse at 70% 15%,#9b424d50,transparent 55%),linear-gradient(135deg,#1e162c,#432333);box-shadow:0 26px 75px #0009;transform:perspective(920px) rotateY(-12deg) rotateZ(-4deg);display:flex;flex-direction:column;justify-content:center;padding:32px;overflow:hidden}
.art::before,.poster::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 26px,#ffffff09 27px),repeating-linear-gradient(90deg,transparent 0 26px,#ffffff09 27px);pointer-events:none}
.art p{position:relative;letter-spacing:.08em;color:#ffe5dd;margin-bottom:12px;font:600 clamp(.77rem,1.4vw,1rem)/1.4 ui-monospace,monospace}
.art p:last-child{margin:9px 0 0;color:#ffae99}
.art strong{color:#ff9a88}
.catalog{padding-bottom:65px}
.catalog-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.catalog-head h2{font-size:clamp(1.65rem,3vw,2.3rem);letter-spacing:-.05em}
.search label{display:block;color:var(--muted);font-size:.8rem;margin-bottom:5px}
.search input{background:#1e1a23;color:var(--text);border:1px solid #4e4350;border-radius:8px;width:min(300px,83vw);padding:11px 13px}
.shelf{margin-bottom:30px}
.shelf h3{font-size:1.12rem;margin:0 0 10px}
.cards{display:grid;grid-auto-columns:minmax(215px,calc((100% - 48px)/5));grid-auto-flow:column;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:5px 5px 13px;margin-inline:-5px;scrollbar-color:#625365 #1b1720}
.tile{scroll-snap-align:start;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:#d47d79}
.poster{position:relative;min-height:106px;display:flex;justify-content:space-between;align-items:center;padding:14px 15px;overflow:hidden;background:radial-gradient(circle at 73% 25%,var(--glow),transparent 68%),var(--base);color:var(--tint)}
.poster small{align-self:start;color:#fff;font:700 .74rem ui-monospace,monospace}
.poster span{font:800 clamp(1.5rem,3vw,2.7rem)/1 ui-monospace,monospace;letter-spacing:-.08em;padding-right:4px;text-shadow:0 6px 18px #000a}
.tile-copy{padding:12px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.tile-copy strong{line-height:1.3}
.tile-copy small,.muted{color:var(--muted)}
.lesson{padding:26px 0 65px}
.lesson-hero{padding:32px clamp(18px,4vw,47px);border:1px solid #53424f;border-radius:17px;background:radial-gradient(ellipse at right top,var(--glow),transparent 70%),var(--base);margin:20px 0 18px}
.lesson h1{font-size:clamp(2rem,5vw,4.2rem);line-height:1.04;letter-spacing:-.06em;max-width:22ch}
.lesson-hero .description{max-width:65ch}
.lesson-menu,.pager{display:flex;gap:9px;flex-wrap:wrap}
.lesson-menu{margin:20px 0 26px}
.lesson-menu a{font-size:.85rem}
.content{max-width:1000px}
.section{padding:clamp(17px,3vw,30px);border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:15px;scroll-margin-top:18px}
.section h2{font-size:clamp(1.25rem,3vw,1.65rem);letter-spacing:-.035em;margin-bottom:11px}
.section p,.section li{line-height:1.65}
.section li+li{margin-top:6px}
.example{padding:11px 14px;border-left:3px solid #f38982;background:#27202b;border-radius:0 7px 7px 0}
.video-block{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;border:1px solid #4b3c4a;border-radius:12px;margin-top:16px;padding:14px}
.watch-card{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:10px;background:linear-gradient(135deg,#332130,#271921);border-radius:8px;padding:16px}
.watch-card h4,.script h3{font-size:1rem;margin:0}
.watch-card iframe{display:block;width:100%;aspect-ratio:16/9;min-height:200px;border:0;border-radius:8px;background:#100f14}
.watch-card .video-fallback{color:var(--muted);font-size:.82rem;text-underline-offset:3px}
.watch-card .button{font-size:.85rem}
.script{align-self:center}
.topic-part{margin-top:24px}
.topic-part h3{margin-bottom:8px}
.topic-video{margin:12px 0}
.topic-video iframe{max-width:650px}
.topic-reading ul{padding-left:1.3em}
.chapter{max-width:72ch;font-size:1.03rem}
.chapter h4{font-size:1.12rem;margin:25px 0 6px}
.chapter p{line-height:1.75}
.chapter pre{max-width:100%;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);line-height:1.5}
.topic-reading details{margin-top:14px}
.flash-open{cursor:pointer;margin-top:8px}
.flash-dialog{width:min(530px,calc(100% - 28px));border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);padding:clamp(15px,4vw,24px)}
.flash-dialog::backdrop{background:#000b}
.flash-head,.flash-controls{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.flash-dialog button{cursor:pointer}
.flash-dialog button:disabled{opacity:.45;cursor:default}
.flash-card{margin:16px 0;padding:18px;background:#27202b;border-radius:9px}
.flash-card p:last-child{margin-bottom:0}
.flash-progress{margin:11px 0 0;font-size:.84rem}
.flash-answer{border-top:1px solid var(--line);padding-top:10px}
.script p{margin:7px 0 0}
details{border-top:1px solid var(--line);padding:11px 0}
summary{cursor:pointer}
details p{margin:8px 0 0}
.reference{overflow-wrap:anywhere}
.pager{margin-top:22px;justify-content:space-between}
.empty{color:var(--muted)}
@media(max-width:780px){.hero-inner{grid-template-columns:1fr 0.65fr;min-height:365px}.art{padding:18px;min-height:185px}.cards{grid-auto-columns:minmax(205px,40%)}}
@media(max-width:700px){.video-block{grid-template-columns:1fr}}
@media(max-width:570px){.hero-inner{display:block;padding-block:40px 30px;min-height:0}.art{display:none}.catalog{padding-top:16px}.cards{grid-auto-columns:minmax(195px,69%)}.video-block{grid-template-columns:1fr}.lesson-hero{padding-block:24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
@media print{.top,.lesson-menu,.pager,.button{display:none}.section,.lesson-hero{break-inside:avoid}}
</style>
</head>

<script id="course" type="application/json">[{"id": "00", "slug": "00-python-git-e-ambiente", "title": "Python, Git e ambiente", "hours": "8 h", "phase": "Fundamentos", "goal": "Qualidade: Git, commits pequenos, pytest e depuração; um teste descreve o comportamento esperado.", "deliverable": "Criar um programa de terminal que recebe um texto, separa palavras, conta frequências e salva um JSON.", "steps": [["Python para transformar dados", "Em Python, uma variável guarda um valor, uma lista reúne valores em ordem e um dicionário associa uma chave a um valor. Para contar palavras, percorra os termos e atualize um dicionário: a palavra é a chave e sua frequência é o valor. Coloque essa transformação em uma função que recebe texto e devolve contagens; trate texto vazio e defina como lidar com maiúsculas e pontuação.", "Entrada: “IA ajuda. IA testa.” → normalização → {\"ia\": 2, \"ajuda\": 1, \"testa\": 1}."], ["Ambiente e organização", "Crie um ambiente virtual por projeto para instalar dependências sem misturar versões com outros trabalhos. Um README explica como executar; um arquivo .env.example lista nomes de variáveis esperadas, sem incluir segredos. Use o terminal para executar o programa, instalar bibliotecas e conferir os arquivos produzidos.", "Fluxo: texto de entrada → função de contagem → arquivo JSON; um JSON válido pode ser aberto e lido novamente."], ["Git e verificação", "Separe alterações em commits pequenos e leia git status e git diff antes de registrar cada uma. Escreva testes para uma frase normal, entrada vazia e palavras repetidas; pytest executa os casos e mostra onde o resultado divergiu. Testes capturam erros no comportamento definido, mas exigem que você escolha bons casos.", "Exemplo: texto vazio deve produzir {} e não lançar exceção inesperada."]], "videos": [{"title": "Python para começar, Curso em Vídeo", "url": "https://www.youtube.com/watch?v=S9uPNppGsGo", "id": "S9uPNppGsGo", "stage": 0, "script": "Leia o exemplo de contagem em voz alta. Defina texto, liste as palavras e explique que o dicionário guarda quantas vezes cada termo apareceu. Execute mentalmente a entrada curta e explique como o resultado se torna JSON. Termine apontando os casos texto vazio e pontuação."}, {"title": "Primeiros comandos em Python", "url": "https://www.youtube.com/watch?v=31llNGKWDdo", "id": "31llNGKWDdo", "stage": 0, "script": "Abra o terminal, execute um comando Python simples e observe a saída. Explique a diferença entre escrever uma expressão, criar uma variável e chamar uma função. Crie uma função que recebe texto e devolve uma contagem; repita com entrada vazia."}], "exercises": ["Criar um programa de terminal que recebe um texto, separa palavras, conta frequências e salva um JSON.", "Isolar a contagem em função pura; testar texto vazio, pontuação e repetição."], "qa": [["Por que usar venv?", "Para isolar dependências de cada projeto."], ["O que um teste de caso vazio verifica?", "O comportamento da função quando não há entrada."], ["Por que não commitar .env?", "Porque pode conter credenciais."], ["O que é uma função pura?", "Mesma entrada produz mesma saída sem alterar estado externo."], ["Como consultar alterações antes de um commit?", "Usar git diff e git status."], ["Qual estrutura associa palavra e contagem?", "Um dicionário."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.python.org/pt-br/3/tutorial/", "https://docs.pytest.org/"], "firstTopic": {"context": "Uma aplicação de IA também precisa tratar dados comuns. O contador de palavras é um primeiro exercício para praticar essa parte em Python.", "cards": [["Por que usar um dicionário na contagem?", "Ele associa cada palavra à sua frequência."], ["O que a função deve devolver ao receber texto vazio?", "Um dicionário vazio, {}."], ["O que muda ao normalizar as letras?", "“IA” e “ia” passam a ser contadas na mesma chave."]], "chapter": [["heading", "Da frase à lista de palavras"], ["paragraph", "Um programa de contagem começa com uma decisão sobre o que conta como palavra. Considere a frase “IA ajuda. IA testa.”. Se dividirmos o texto apenas pelos espaços, obtemos os itens “IA”, “ajuda.”, “IA” e “testa.”. Os pontos continuam presos às palavras. Se outro trecho contiver “ajuda” sem ponto, o programa passa a contar duas formas separadas. Normalizar o texto é definir quais diferenças serão ignoradas. Neste exercício, convertemos a frase para minúsculas, trocamos a pontuação por espaços e separamos os termos."], ["heading", "O dicionário funciona como uma tabela de contagem"], ["paragraph", "A lista resultante contém “ia”, “ajuda”, “ia” e “testa”, na ordem em que aparecem. O dicionário tem outra função. Ele permite consultar a contagem pela própria palavra. Na primeira ocorrência de “ia”, ainda não existe uma chave com esse nome. O programa parte de zero e grava 1. Quando “ia” reaparece, ele consulta a contagem anterior e grava 2. O método get do dicionário lê uma chave e permite fornecer um valor padrão quando ela não existe."], ["heading", "A função devolve os dados"], ["code", "def contar_palavras(texto):\n    normalizado = \"\".join(\n        caractere.lower() if caractere.isalnum() else \" \"\n        for caractere in texto\n    )\n    contagem = {}\n    for palavra in normalizado.split():\n        contagem[palavra] = contagem.get(palavra, 0) + 1\n    return contagem"], ["paragraph", "Para a frase do exemplo, a função devolve {\"ia\": 2, \"ajuda\": 1, \"testa\": 1}. Para texto vazio, a lista de termos vem vazia, o laço não roda e o resultado é {}. Separar a função do terminal e da escrita em JSON permite testar essas duas entradas sem criar arquivos."]]}, "laterTopics": [{"chapter": [["heading", "Um projeto pode ser executado por outra pessoa"], ["paragraph", "O contador de palavras já existe como função. Para virar um programa, ele precisa receber uma entrada, chamar a função e entregar o resultado num formato que outra pessoa ou programa consiga abrir. Uma divisão simples põe a função em contador.py e a interação com o terminal em main.py. O arquivo principal pode ler um texto em UTF-8 e usar o módulo json da biblioteca padrão para gravar a contagem. Assim, a função continua funcionando em um teste que usa uma frase diretamente."], ["heading", "O ambiente guarda as dependências do projeto"], ["paragraph", "O ambiente virtual cria um local separado para instalar bibliotecas. Se o projeto A precisa de uma versão de uma biblioteca e o B de outra, cada ambiente mantém suas próprias instalações. O contador usa apenas a biblioteca padrão para produzir JSON, mas pytest será uma dependência de desenvolvimento. No README, registre qual comando cria o ambiente, qual instala as dependências e qual executa o programa. Isso ajuda a distinguir um erro do código de uma instalação incompleta."], ["heading", "Os arquivos têm finalidades diferentes"], ["paragraph", "O código, os testes e o README entram no controle de versão. A pasta .venv é recriada em cada máquina. Um .env.example pode mostrar nomes de variáveis necessárias, como LOCAL_DOS_DADOS, com valores fictícios. Se houver um .env real com credenciais, deixe-o fora do repositório. O resultado JSON também pode ser regenerado. Para verificar o fluxo completo, salve a saída, abra o arquivo e compare seus valores com a contagem esperada."]], "references": [["https://docs.python.org/pt-br/3/tutorial/venv.html", "Python · criação de ambientes virtuais e instalação de pacotes"]]}, {"chapter": [["heading", "O histórico registra o que foi mudado"], ["paragraph", "Suponha que você tenha alterado a contagem para tratar letras maiúsculas e também corrigido uma vírgula no README. git status mostra quais arquivos mudaram. git diff mostra as diferenças ainda fora da área de preparação, e git diff --staged mostra as alterações preparadas para o próximo commit. Revisar essas duas visões evita incluir arquivos por engano. Um commit pequeno com uma intenção clara facilita localizar a mudança que introduziu um defeito."], ["heading", "Um teste descreve um comportamento"], ["paragraph", "O teste fornece uma entrada à função e compara a saída com a esperada. Para “IA ajuda, IA testa”, o esperado é que a chave ia tenha valor 2 e que a vírgula desapareça. Uma entrada vazia deve devolver um dicionário vazio. Teste também uma palavra repetida com capitalizações diferentes. Esses casos mostram se a função lida com repetição, pontuação e ausência de entrada, em vez de confirmar apenas que o programa rodou."], ["heading", "A primeira falha orienta a depuração"], ["paragraph", "Se a saída contiver “ajuda,” como chave, confira o resultado imediatamente depois da normalização. Se a lista de palavras estiver correta e a contagem falhar, confira o ponto em que o programa consulta e atualiza o dicionário. A mensagem do pytest mostra a diferença entre o esperado e o obtido. Depois de corrigir, execute o conjunto inteiro. O teste que falhava comprova a correção específica, e os outros ajudam a detectar comportamentos que a mudança quebrou."]], "references": [["https://git-scm.com/docs/git-diff", "Git · diferenças no diretório de trabalho e na área de preparação"], ["https://docs.pytest.org/", "pytest · primeiros testes e leitura de falhas"]]}]}, {"id": "01", "slug": "01-engenharia-de-software-com-ia", "title": "Engenharia de software com IA", "hours": "8 h", "phase": "Fundamentos", "goal": "Entrega: testes automatizados, revisão humana, registro de decisões, acessibilidade básica e versionamento.", "deliverable": "Especificar um portal de perguntas sobre documentação interna com três jornadas: publicar, perguntar e revisar resposta.", "steps": [["Problema, usuário e escopo", "Comece descrevendo quem precisa da solução, o problema observado e a primeira tarefa que precisa funcionar. Uma jornada mostra o caminho do usuário; um critério de aceite descreve uma entrada e o resultado observável. Limites explícitos evitam prometer busca em documentos que ainda não foram indexados.", "Critério: ao perguntar sobre uma regra inexistente, o portal informa que não encontrou evidência."], ["Construção assistida por IA", "Divida a implementação em tarefas verificáveis, como criar o formulário, validar o campo e exibir a resposta. Dê à IA o contexto mínimo necessário e peça uma mudança por vez. Compare o código proposto com o código anterior e procure alterações inesperadas em permissões, dependências ou outros fluxos.", "Peça uma interface para perguntar; depois verifique se o formulário bloqueia pergunta vazia."], ["Revisão e entrega", "Teste critérios de aceite, revise o diff e registre decisões técnicas. Verifique uso básico por teclado e leitura dos rótulos da interface. Uma entrega demonstra comportamento reproduzível, inclusive falha tratada, e registra o que ainda depende de implementação.", "Se a consulta falhar, a interface mostra uma mensagem compreensível e permite tentar novamente."]], "videos": [{"title": "Prompts na prática, referência da UNIPDS", "url": "https://youtu.be/ysPbXH0LpIE", "id": "ysPbXH0LpIE", "stage": 1, "script": "Apresente o problema do portal e uma jornada concreta. Transforme a jornada em critério verificável, peça à IA uma mudança pequena na interface e leia o diff. Termine explicando como identificar um erro gerado e como comprovar a correção."}], "exercises": ["Especificar um portal de perguntas sobre documentação interna com três jornadas: publicar, perguntar e revisar resposta.", "Implementar uma pequena interface com IA assistindo; registrar três erros encontrados na revisão."], "qa": [["O que distingue critério de aceite de uma ideia?", "Critério é verificável com cenário e resultado esperado."], ["Por que dividir prompts por tarefa?", "Facilita revisão e localização de regressões."], ["O que revisar antes de aceitar código gerado?", "Comportamento, segurança, testes, dependências e diff."], ["Quem decide o escopo?", "A pessoa responsável pelo produto."], ["Por que usar Git em prototipagem rápida?", "Para manter histórico e poder revisar e reverter mudanças."], ["Que artefato descreve a experiência de um usuário?", "Uma jornada com passos e resultados esperados."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://www.asimov.academy/trilhas/vibe-coding/", "https://github.com/unipds-engenharia-de-ia-aplicada/engenharia-de-software-com-ia-aplicada"], "firstTopic": {"context": "O portal de documentação começa com uma necessidade concreta. Alguém precisa encontrar e conferir uma resposta sobre o acervo.", "cards": [["O que uma jornada descreve?", "O caminho que uma pessoa percorre para completar uma tarefa."], ["Como reconhecer um critério de aceite verificável?", "Ele descreve um cenário e um resultado que você consegue observar ou testar."]], "chapter": [["heading", "O problema vem antes da tela"], ["paragraph", "Imagine um funcionário que precisa conferir a política de férias antes de solicitar uma data. Hoje ele alterna entre documentos e pergunta a colegas qual versão está valendo. Nesse cenário, “criar um chat” é uma proposta de interface. O problema é encontrar a regra aplicável e conferir sua origem. Essa diferença afeta o que a primeira versão precisa entregar. Um chat pode parecer pronto mesmo que ainda use documentos desatualizados."], ["heading", "Uma jornada mostra onde a aplicação pode falhar"], ["paragraph", "O funcionário abre o portal, pergunta sobre o prazo, lê uma resposta e segue a fonte para conferir. Cada etapa depende de uma ação do produto. A pergunta precisa ser aceita, o acervo precisa conter o regulamento, e a resposta precisa indicar onde o prazo está escrito. Se a versão nova não está no acervo, a última etapa quebra mesmo que a tela funcione. A jornada dá um jeito concreto de enxergar essa falha antes de repartir o trabalho."], ["heading", "A ideia vira um critério verificável"], ["paragraph", "Considere um acervo com uma política que informa um prazo de 30 dias. Ao perguntar “Com quanto tempo de antecedência devo pedir férias?”, a resposta precisa apresentar o prazo e identificar a seção que o sustenta. Em outro cenário, retire a política da base e faça a mesma pergunta. Agora o resultado esperado é uma indicação de ausência de evidência. Esses dois casos permitem revisar a implementação. O primeiro verifica a resposta fundamentada e o segundo verifica o comportamento diante de uma lacuna."]]}, "laterTopics": [{"chapter": [["heading", "O trabalho começa por uma mudança demonstrável"], ["paragraph", "O portal precisa receber perguntas e indicar a fonte da resposta. Pedir à IA para “fazer o portal” mistura interface, acesso aos dados, regras e estados de erro. Uma primeira alteração pode criar apenas o formulário e impedir o envio vazio. A próxima pode conectar o formulário a uma função que devolve uma resposta simulada. Cada pacote tem um comportamento que você consegue executar, revisar e, se necessário, desfazer."], ["heading", "O pedido à IA precisa do contexto certo"], ["paragraph", "Mostre o componente que será modificado, o formato esperado e a condição de aceite. Por exemplo, o botão deve ficar disponível com texto válido, exibir um estado de carregamento durante a chamada e manter a pergunta se houver erro. Se a aplicação já tem uma função de requisição, diga onde ela está. Com esse contexto, a sugestão tem mais chance de reutilizar o que já existe e pode ser julgada contra o comportamento descrito."], ["heading", "Uma sugestão de código é uma proposta"], ["paragraph", "Leia o diff e acompanhe a execução desde o botão até a resposta. Às vezes a interface passa no teste visual, mas o código introduz uma nova dependência ou altera uma regra de acesso para facilitar a integração. Verifique um caso válido, um formulário vazio e uma falha da consulta. Se o envio vazio ainda chega ao servidor, a mudança não cumpre o critério, mesmo que o botão pareça desabilitado em uma tela."]], "references": [["https://www.asimov.academy/trilhas/vibe-coding/", "Asimov · contexto para construção assistida"], ["https://github.com/unipds-engenharia-de-ia-aplicada/engenharia-de-software-com-ia-aplicada", "UNIPDS · exemplos de engenharia de software com IA"]]}, {"chapter": [["heading", "O que torna a entrega verificável"], ["paragraph", "Uma demonstração começa com o cenário que motivou a mudança. Envie uma pergunta sobre um prazo conhecido e confira a resposta e sua fonte. Em seguida, use uma pergunta para a qual o acervo não tem evidência. Esses dois casos testam comportamentos diferentes. Para reproduzir o resultado, registre qual acervo e qual versão do aplicativo foram usados."], ["heading", "O erro também faz parte da interface"], ["paragraph", "Imagine que a consulta falhe depois que a pessoa digitou uma pergunta longa. Um fluxo útil conserva o texto, comunica a falha e permite tentar novamente. Teste a tela também por teclado. O foco precisa alcançar o campo e o botão numa sequência que faça sentido, e o campo precisa ter um rótulo que identifique o que deve ser preenchido. Isso detecta problemas que o clique rápido de quem implementou pode esconder."], ["heading", "Revisar a implementação e explicar a decisão"], ["paragraph", "Depois de checar o comportamento, leia as alterações de código e os testes. Peça que alguém reproduza pelo menos um caso sem depender de uma explicação ao vivo. Se a primeira versão usa um conjunto fixo de documentos para simplificar a busca, registre isso junto com a razão. Quando surgir a necessidade de atualizar o acervo com frequência, a equipe consegue entender de onde veio a decisão e o que precisa mudar."]], "references": [["https://github.com/unipds-engenharia-de-ia-aplicada/engenharia-de-software-com-ia-aplicada", "UNIPDS · materiais de construção e validação de aplicações"]]}]}, {"id": "02", "slug": "02-fundamentos-llm-e-prompts", "title": "LLMs, tokens e prompts", "hours": "10 h", "phase": "Fundamentos", "goal": "Experimento: comparar respostas em 20 casos, medir formato, correção, custo e latência.", "deliverable": "Construir 20 exemplos de classificação de mensagens por intenção e um prompt com saída JSON.", "steps": [["Como um modelo de linguagem responde", "O modelo recebe uma sequência de tokens e prevê continuações conforme padrões aprendidos. A janela de contexto limita o que ele pode considerar em uma chamada; temperatura influencia a variação das respostas, mas não corrige fatos. Embeddings são vetores usados para comparar semelhança entre textos, úteis na recuperação de documentos.", "Para classificar mensagens, defina as categorias antes de pedir uma resposta ao modelo."], ["Instrução, exemplos e saída", "Um prompt útil separa tarefa, dados recebidos, regras e formato esperado. Exemplos mostram casos difíceis; um esquema JSON reduz ambiguidade para o código consumidor. Trate texto de usuário e documentos como dados, não como comandos para mudar as regras do sistema.", "Saída desejada: {\"intencao\":\"suporte\",\"confianca\":\"alta\"}; valide as chaves antes de usar."], ["Comparação controlada", "Monte 20 mensagens rotuladas antes do experimento. Rode as mesmas entradas com prompt sem exemplos e com exemplos; conte acertos, respostas fora do esquema, tempo e tokens. Guarde os erros para decidir se vale mudar instrução, exemplos ou arquitetura.", "Se um prompt acerta 16/20 e outro 18/20, examine também os dois erros restantes e o custo."]], "videos": [{"title": "Transformers e embeddings, seleção da UNIPDS", "url": "https://www.youtube.com/watch?v=ynNDmp7hBdo", "id": "ynNDmp7hBdo", "stage": 0, "script": "Mostre que texto vira tokens e que embeddings aproximam significados para busca. Compare duas perguntas parecidas e explique por que recuperar um trecho relevante não garante, por si só, uma resposta correta."}, {"title": "Prompt engineering, seleção da UNIPDS", "url": "https://youtu.be/ysPbXH0LpIE", "id": "ysPbXH0LpIE", "stage": 1, "script": "Escreva uma instrução com tarefa, categorias e JSON esperado. Compare uma versão sem exemplos e outra com exemplos usando as mesmas mensagens. Explique o que medir e como tratar texto externo como dado."}], "exercises": ["Construir 20 exemplos de classificação de mensagens por intenção e um prompt com saída JSON.", "Comparar prompt zero shot e few shot; anotar erros e custos por exemplo."], "qa": [["O que é um token?", "Unidade de texto usada pelo modelo para entrada e saída."], ["Embeddings substituem a resposta final?", "Não; representam dados para comparação e recuperação."], ["Por que saída estruturada?", "Facilita validação e consumo por código."], ["Temperatura alta garante criatividade útil?", "Não; altera a amostragem e pode elevar variabilidade."], ["Qual é o risco de tratar texto recuperado como instrução?", "Prompt injection."], ["Como medir melhoria de prompt?", "Comparar os mesmos casos e métricas antes e depois."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/", "https://huggingface.co/learn/llm-course/"], "firstTopic": {"context": "Modelos de linguagem recebem texto em partes chamadas tokens. Essa forma de processamento ajuda a entender por que as respostas variam e por que o contexto disponível tem limite.", "cards": [["O que limita a janela de contexto?", "A quantidade de tokens que pode ser considerada na chamada."], ["Para que serve um embedding na busca?", "Para representar conteúdo numericamente e comparar sua semelhança com uma consulta."], ["Diminuir a temperatura verifica os fatos?", "Não. Ela altera a variação das respostas. A verificação depende de evidência e avaliação."]], "chapter": [["heading", "O modelo trabalha com partes do texto"], ["paragraph", "Quando uma mensagem entra em um modelo de linguagem, um tokenizador a converte em uma sequência de unidades numéricas. Um token pode corresponder a uma palavra, a um pedaço dela ou a um sinal. A divisão depende do tokenizador. Ao gerar texto, o modelo usa a sequência disponível para calcular continuações possíveis e produz novos tokens. Uma continuação pode ser plausível mesmo quando a mensagem não dá elementos para confirmar o fato."], ["heading", "O que cabe na chamada"], ["paragraph", "Considere “Meu pedido chegou incompleto”. A chamada pode incluir uma instrução de classificação, exemplos de pedidos anteriores e a mensagem atual. Esses elementos ocupam a janela de contexto, que tem capacidade finita. Se a informação necessária estiver num documento que ficou de fora, ela não entra como evidência naquela chamada. A temperatura afeta a maneira como o sistema escolhe entre continuações possíveis. Reduzir a variação pode tornar respostas mais consistentes, mas não acrescenta evidência."], ["heading", "Comparar significados é uma etapa separada"], ["paragraph", "“Faltou um item na entrega” e “Minha encomenda veio incompleta” descrevem problemas parecidos com termos diferentes. Um sistema de busca literal pode perder essa relação. Um modelo de embeddings transforma cada mensagem em um vetor. A busca compara os vetores e pode aproximar as duas mensagens mesmo sem termos iguais. Esse vetor serve para localizar conteúdo semelhante. A classificação ou a resposta final ainda depende do que a aplicação faz com o material encontrado."]]}, "laterTopics": [{"chapter": [["heading", "O pedido e os dados ocupam lugares diferentes"], ["paragraph", "Um classificador pode receber como tarefa “atribua uma categoria à mensagem”. Depois vêm as categorias permitidas e a mensagem que deve ser analisada. “Meu pedido chegou incompleto” faz parte dos dados. Esse texto precisa ficar claramente identificado, assim como qualquer documento recuperado. A aplicação define o que deve ser feito com a mensagem e valida a saída antes de agir sobre ela."], ["heading", "Os exemplos resolvem casos ambíguos"], ["paragraph", "Considere duas categorias, suporte e comercial. “Quanto custa a entrega?” pode entrar em comercial. “Minha entrega veio incompleta” entra em suporte. Um exemplo com a palavra entrega em cada categoria mostra que a decisão depende da intenção inteira. Se mensagens de acompanhamento como “consigo mudar meu endereço depois de pagar?” geram dúvida, inclua um caso desse tipo com uma classificação coerente com a regra escolhida."], ["heading", "O programa também precisa entender a resposta"], ["paragraph", "Um humano pode entender “Parece um pedido de suporte”. Se a aplicação espera JSON, ela precisa de algo como {\"intencao\":\"suporte\"}. O esquema define os campos e valores aceitos. O código que recebe o resultado pode rejeitar um campo ausente ou uma categoria desconhecida. Respeitar o esquema e decidir a categoria certa são verificações separadas. Uma resposta pode ser JSON válido e ainda classificar a mensagem no grupo errado."]], "references": [["https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/", "Asimov · construção de aplicações inteligentes"], ["https://huggingface.co/learn/llm-course/", "Hugging Face · fundamentos para trabalhar com modelos de linguagem"]]}, {"chapter": [["heading", "Uma comparação precisa das mesmas entradas"], ["paragraph", "Separe 20 mensagens de avaliação e atribua uma categoria de referência a cada uma antes de rodar o teste. Inclua casos fáceis e casos que as regras podem confundir. Use a mesma lista para o prompt sem exemplos e para o prompt com exemplos. Os exemplos colocados no prompt devem vir de fora da lista de avaliação para que o teste meça o que acontece com mensagens novas."], ["heading", "Observe cada saída em mais de uma dimensão"], ["paragraph", "Para cada caso, registre se o JSON é válido, se a categoria bate com a referência, quanto tempo a chamada levou e quantos tokens foram usados. Uma versão pode passar de 16 para 18 acertos em 20 mensagens e, ao mesmo tempo, quebrar o formato de duas. Isso tem um efeito diferente para um programa que depende do esquema. Também vale repetir o ensaio quando a geração varia e registrar o modelo e os parâmetros usados."], ["heading", "O padrão dos erros orienta a próxima revisão"], ["paragraph", "Se quase todos os erros ocorrem quando alguém menciona preço e suporte na mesma mensagem, talvez a regra sobre a intenção principal esteja incompleta. Se o conteúdo é correto e chega acompanhado de comentários fora do JSON, investigue o formato e a validação. O número agregado ajuda a comparar versões. Ler as saídas problemáticas explica qual parte da tarefa ainda precisa de trabalho."]], "references": [["https://huggingface.co/learn/llm-course/", "Hugging Face · noções de conjuntos de dados e avaliação"]]}]}, {"id": "03", "slug": "03-apis-e-apps-inteligentes", "title": "APIs e aplicativos inteligentes", "hours": "10 h", "phase": "Fundamentos", "goal": "Entrega: criar API FastAPI, interface simples, logs sem dados privados e orçamento de tokens.", "deliverable": "Criar API /classificar que chama um modelo por adaptador e devolve JSON validado; incluir um modo mock sem chave.", "steps": [["HTTP e provedores", "Uma API recebe uma requisição e devolve uma resposta com status e corpo. Isole a chamada ao modelo em um adaptador: a regra de classificação não deve depender diretamente do formato de um provedor. Guarde chaves em variável de ambiente; trate timeout, resposta inválida e limite de uso.", "POST /classificar recebe uma mensagem e devolve intenção validada em JSON."], ["Camadas da aplicação", "A interface coleta a pergunta, a rota valida a entrada, o serviço executa a tarefa e o adaptador conversa com o modelo ou com um mock. Essa separação permite testar sem gastar chamadas pagas e trocar a implementação do provedor depois. Valide também a saída antes de mostrá-la.", "Um modo mock devolve uma intenção conhecida para testar formulário e rota sem chave."], ["Falhas e orçamento", "Defina tempo limite e tentativas limitadas apenas para operações em que repetir é seguro. Mostre ao usuário uma mensagem útil quando houver falha e registre logs sem texto privado ou credenciais. Estime tokens por chamada e um limite de gasto para evitar uso inesperado.", "Teste o caso em que o provedor demora demais e o caso em que devolve JSON inválido."]], "videos": [{"title": "FastAPI para iniciantes", "url": "https://www.youtube.com/watch?v=BtIy2aD8k_w", "id": "BtIy2aD8k_w", "stage": 1, "script": "Apresente o caminho formulário → rota HTTP → serviço → provedor. Demonstre uma requisição válida e uma inválida, explique status e validação. Substitua o provedor por mock e descreva timeout, erro e uso de chave por variável de ambiente."}], "exercises": ["Criar API /classificar que chama um modelo por adaptador e devolve JSON validado; incluir um modo mock sem chave.", "Criar interface com formulário e testar erro de timeout e JSON inválido."], "qa": [["Por que separar adaptador do provedor?", "Para trocar modelo sem alterar a lógica do produto."], ["O que fazer com timeout?", "Tratar a falha, aplicar retry limitado quando seguro e informar o usuário."], ["Onde guardar a API key?", "Em variável de ambiente ou gerenciador de segredos."], ["Qual vantagem do mock?", "Testar fluxo sem chamada paga ou rede."], ["Por que validar a saída?", "O modelo pode descumprir o formato solicitado."], ["O que registrar em produção?", "Evento, duração, erro e uso, sem vazar dados sensíveis."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://fastapi.tiangolo.com/tutorial/", "https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/"], "firstTopic": {"context": "Quando a interface chama um modelo, a aplicação passa a depender de um serviço externo. É preciso definir o que entra, o que sai e como o sistema reage a falhas.", "cards": [["Qual é a função do adaptador do provedor?", "Encapsular a chamada externa e converter seu retorno para o formato usado pela aplicação."], ["Onde guardar a chave do provedor?", "Em variável de ambiente ou gerenciador de segredos, fora do código e dos logs."]], "chapter": [["heading", "O que passa por uma chamada HTTP"], ["paragraph", "Imagine um formulário que recebe “Meu pedido chegou incompleto”. Ao enviar a mensagem, a interface pode fazer um POST para /classificar, com um corpo JSON que contém o campo mensagem. O servidor confere esse corpo antes de chamar o provedor de IA. Se a mensagem estiver vazia, ele consegue devolver um erro de entrada sem gastar nenhuma chamada ao modelo."], ["heading", "A fronteira com o provedor"], ["paragraph", "O serviço de classificação sabe que precisa receber texto e devolver uma intenção. O adaptador conhece os detalhes do provedor, prepara a autenticação, envia a solicitação e interpreta o retorno. Em produção, a chave fica sob responsabilidade do servidor e sai da configuração do ambiente. O formulário no navegador chama a sua API sem ter acesso à chave do provedor."], ["heading", "Um retorno válido não é apenas uma resposta bem escrita"], ["paragraph", "Para o formulário, um resultado útil pode ser {\"intencao\": \"reclamacao\"}. Se o provedor devolver texto livre ou um valor que a aplicação não reconhece, o adaptador e o serviço precisam detectar isso antes de responder ao formulário. Um timeout é outro caso. O servidor precisa encerrar a espera e informar a falha de forma compreensível. Durante testes, um mock pode devolver a intenção esperada, uma resposta inválida ou um timeout simulado. Dessa forma, cada comportamento da API pode ser observado sem depender do serviço externo."]]}, "laterTopics": [{"chapter": [["heading", "Da interface ao serviço"], ["paragraph", "Quando a pessoa envia “Meu pedido veio incompleto”, a interface coleta a mensagem e a rota valida o corpo da requisição. O serviço então decide como executar a classificação e qual resultado pode devolver. A separação torna possível usar o serviço em outro contexto sem copiar a validação e os estados visuais da tela. Também impede que detalhes do fornecedor se espalhem pelo formulário."], ["heading", "O adaptador protege o contrato da aplicação"], ["paragraph", "Um provedor pode devolver a resposta dentro de uma lista de mensagens. Outro pode ter um formato diferente. O adaptador transforma ambos no formato esperado pelo serviço, por exemplo, uma intenção e uma indicação de erro. Se o provedor trocar o nome de um campo, a correção fica concentrada no adaptador. A rota continua entregando o contrato que os clientes da aplicação já conhecem."], ["heading", "O mock simula sucesso e falha"], ["paragraph", "Um mock pode devolver suporte quando recebe uma entrada conhecida. Isso permite testar se a tela mostra a intenção e se a API entrega JSON válido. Outro mock pode produzir um erro ou uma resposta incompatível. Use esse caso para conferir se a validação impede que um valor inválido chegue ao usuário. O mock serve para verificar como o aplicativo reage. Uma chamada de integração separada confirma a comunicação real com o provedor quando for necessário."]], "references": [["https://fastapi.tiangolo.com/tutorial/", "FastAPI · rotas, corpo da requisição e modelos de saída"]]}, {"chapter": [["heading", "Defina quanto tempo a API pode esperar"], ["paragraph", "Imagine que a classificação normalmente leve dois segundos e que o provedor fique instável. Sem um limite, várias solicitações podem ficar aguardando e consumir capacidade do servidor. Um timeout delimita essa espera. Se o tempo máximo terminar, a API trata a falha e devolve uma resposta clara. A interface pode preservar a pergunta e oferecer uma nova tentativa para que a pessoa não tenha de digitar tudo de novo."], ["heading", "Uma nova tentativa precisa caber no orçamento"], ["paragraph", "Um erro temporário pode justificar repetir uma consulta, desde que a operação tolere repetição e ainda haja tempo no orçamento total. Repetir automaticamente um POST que publica ou envia algo pode aplicar a ação duas vezes. Em uma classificação, o custo da chamada anterior ainda pode existir mesmo que o cliente não tenha recebido resposta. Limite tentativas, tempo e volume de dados enviados em vez de depender apenas de um limite mensal."], ["heading", "Registre o que ajuda a corrigir o problema"], ["paragraph", "Horário, duração, tipo de erro e identificador da solicitação ajudam a ligar uma falha da interface à operação no servidor. A pergunta em texto integral e a credencial do provedor não são necessárias nesse registro. Um timeout e um JSON inválido também merecem categorias diferentes. O primeiro aponta para espera ou comunicação. O segundo indica que uma resposta chegou, mas não atendia ao contrato esperado."]], "references": [["https://fastapi.tiangolo.com/tutorial/", "FastAPI · tratamento de erros HTTP e testes de API"]]}]}, {"id": "04", "slug": "04-rag-busca-e-citacoes", "title": "RAG: busca, recuperação e citações", "hours": "14 h", "phase": "Construção", "goal": "Resposta: citar trecho e origem, admitir ausência de evidência e testar recuperação separada da geração.", "deliverable": "Montar base com 10 documentos públicos e 20 perguntas com trechos de referência.", "steps": [["Preparação dos documentos", "RAG adiciona trechos recuperados ao contexto de uma resposta. Colete apenas documentos permitidos, extraia texto, divida em partes que mantenham sentido e guarde título, origem, versão e regras de acesso. Uma citação precisa permitir reencontrar o trecho original.", "Documento “Política de férias”, versão 2 → trechos numerados com título e origem."], ["Recuperação da evidência", "Comece por busca de termos e compare com embeddings em perguntas reais. Busca híbrida combina pistas lexicais e semânticas; filtros impedem recuperar material sem acesso autorizado. Em recall@k, conte em quantas perguntas o trecho correto aparece entre os k primeiros resultados.", "Se em 16 de 20 perguntas o trecho correto aparece no top 5, recall@5 = 80%."], ["Resposta citada e ausência de prova", "Passe ao modelo apenas trechos autorizados; peça afirmações sustentadas por citações verificáveis. Compare primeiro a recuperação com o gabarito e depois a qualidade da resposta: uma resposta elegante pode estar baseada no trecho errado. Quando falta evidência, diga que não encontrou base suficiente.", "Pergunta fora dos 10 documentos deve receber indicação de ausência de evidência, sem inventar regra."]], "videos": [{"title": "RAG do zero, freeCodeCamp", "url": "https://www.youtube.com/watch?v=sVcwVQRHIc8", "id": "sVcwVQRHIc8", "stage": 0, "script": "Comece com um documento autorizado. Separe-o em trechos com origem, recupere candidatos para uma pergunta e peça resposta com citação. Mostre o caso sem evidência e a necessidade de dizer que não sabe."}, {"title": "RAG em produção, freeCodeCamp", "url": "https://www.youtube.com/watch?v=mHxLXzYjQRE", "id": "mHxLXzYjQRE", "stage": 1, "script": "Mostre 20 perguntas rotuladas. Compare busca lexical e busca por embeddings usando recall@k. Inspecione uma recuperação errada, acrescente filtro de acesso e valide se as citações sustentam as afirmações."}], "exercises": ["Montar base com 10 documentos públicos e 20 perguntas com trechos de referência.", "Comparar busca por palavras e embeddings usando recall@k; gerar resposta com fonte e recusa fundamentada quando faltar evidência."], "qa": [["O que o RAG altera?", "O contexto apresentado ao modelo na inferência, não os pesos do modelo."], ["Por que metadados?", "Para filtrar, citar origem e controlar versões e acesso."], ["O que mede recall@k?", "A fração de perguntas cujo trecho relevante aparece entre os k recuperados."], ["Quando começar por busca lexical?", "Quando documentos e termos exatos permitem uma base simples e barata."], ["O que fazer sem trecho confiável?", "Declarar insuficiência de evidência e não inventar citação."], ["Qual diferença entre falha de busca e falha de resposta?", "A primeira não encontra evidência; a segunda usa mal a evidência encontrada."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langchain/retrieval", "https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/"], "firstTopic": {"context": "Quando a resposta depende de um documento, o assistente precisa localizar o trecho que a sustenta. O trabalho começa preparando o acervo para que cada trecho possa ser encontrado e citado.", "cards": [["O que o RAG acrescenta à chamada do modelo?", "Trechos recuperados que podem servir de evidência para responder."], ["Quais metadados ajudam a conferir uma citação?", "Título, origem, versão e, quando disponível, seção ou página do trecho."], ["Por que dividir o documento por assunto?", "Para recuperar blocos que mantêm contexto suficiente e identificar de onde a informação veio."]], "chapter": [["heading", "Por que preparar os documentos"], ["paragraph", "Suponha que alguém pergunte ao assistente “Qual é o prazo para pedir férias?”. Uma resposta como “30 dias” pode soar convincente. Para conferi-la, precisamos saber se uma política autorizada afirma isso, em qual trecho e em qual versão. Em RAG, a aplicação recupera trechos do acervo, entrega esses trechos como contexto ao modelo e usa suas origens para apresentar uma resposta verificável. O trabalho começa bem antes da pergunta, na preparação do acervo."], ["heading", "Do regulamento ao trecho pesquisável"], ["paragraph", "Imagine uma política fictícia com três seções. A primeira descreve quem pode pedir férias, a segunda diz como fazer a solicitação e a terceira indica que o prazo é de 30 dias. Salvar o texto todo em um único bloco dificulta apontar a passagem exata. Cortar em fragmentos curtos demais pode separar “30 dias” da frase que indica a que esse prazo se aplica. A divisão mais útil preserva juntas a regra e as condições que mudam seu significado. Neste caso, podemos criar um trecho para cada seção."], ["heading", "O trecho tem conteúdo e identidade"], ["paragraph", "O trecho do prazo pode ter um identificador, o título da política, a seção, a versão e uma referência para abrir o documento original. O texto mantém a regra legível. Os metadados permitem localizar a fonte e ajudam a filtrar versões ou permissões. Se a versão de janeiro informa 30 dias e a de julho informa 45, guardar as versões permite ao sistema distinguir as regras e restringir a consulta à política aplicável."], ["code", "ID: ferias-v2-secao-3\nDocumento: Política de férias (exemplo fictício)\nSeção: Prazo para solicitação\nVersão: julho\nTexto: O pedido deve ser enviado com 45 dias de antecedência."], ["paragraph", "Quando chega a pergunta, a busca precisa encontrar esse trecho e confirmar que ele pode ser usado para aquela pessoa. Recuperar um parágrafo sobre quem pode solicitar férias ainda seria uma falha de busca, mesmo sendo do documento correto. Depois da recuperação, a resposta pode citar a seção e a versão. Se o material recuperado não sustenta nenhum prazo, a aplicação deve indicar que faltam dados para responder. A comparação entre formas de buscar entra no Tópico 2."]]}, "laterTopics": [{"chapter": [["heading", "Localizar o trecho é uma tarefa de busca"], ["paragraph", "Depois de preparar os documentos, o sistema recebe a pergunta “Com quanta antecedência aviso que vou sair de férias?”. Uma busca lexical dá peso a palavras que aparecem no acervo. Ela pode encontrar “férias”, mas também ordenar primeiro um trecho sobre quem tem direito ao benefício. Uma busca por embeddings aproxima a pergunta de frases com sentido semelhante, como “prazo para solicitação”. Códigos, nomes de seções e termos exatos ainda podem favorecer a busca lexical."], ["heading", "Reunir candidatos e aplicar filtros"], ["paragraph", "Uma estratégia híbrida reúne sinais da busca lexical e da busca por vetores. O sistema ordena os candidatos e devolve os melhores trechos, mantendo seus metadados. Antes de enviar candidatos ao modelo, restrinja as fontes ao que a pessoa pode consultar e à versão aplicável. Se a política de julho informa 45 dias, uma passagem de janeiro com 30 dias pode ser muito semelhante à pergunta e ainda assim estar fora do conjunto que deve responder ao caso."], ["heading", "Meça se a evidência aparece entre os primeiros resultados"], ["paragraph", "Monte uma lista de perguntas com os trechos esperados. Se cada pergunta tem um único trecho de referência e 16 de 20 o encontram entre os cinco primeiros, recall@5 é 80%. Uma pergunta que recuperou o documento certo mas trouxe a seção errada conta como falha nessa avaliação. Compare as estratégias usando as mesmas 20 perguntas. Esse teste termina na lista de trechos, antes de pedir ao modelo que escreva a resposta."]], "references": [["https://docs.langchain.com/oss/python/langchain/retrieval", "LangChain · recuperação de documentos e arquiteturas de RAG"]]}, {"chapter": [["heading", "Da passagem recuperada à afirmação"], ["paragraph", "Imagine que a busca encontrou a política fictícia de julho e o trecho “O pedido deve ser enviado com 45 dias de antecedência”. A resposta pode dizer “O pedido deve ser enviado com 45 dias de antecedência, segundo a Política de férias de julho, seção Prazo para solicitação”. A citação permite conferir qual texto sustenta a afirmação. Se a fonte trata de outro tipo de pedido, a presença do número 45 por si só não basta."], ["heading", "Quando a evidência é parcial"], ["paragraph", "A pessoa pergunta se o prazo muda em feriados. O trecho informa apenas o prazo geral. Uma resposta fundamentada pode dizer “A política consultada informa 45 dias para o prazo geral. Não encontrei uma regra para feriados nesse trecho”. Essa resposta distingue o que o documento afirma daquilo que o acervo não confirmou. Se duas fontes parecem divergir, confira a data, o escopo e a versão aplicável antes de escolher uma."], ["heading", "Em qual etapa aconteceu a falha?"], ["paragraph", "Registre os trechos que chegaram ao modelo e compare com o gabarito da pergunta. Se a busca trouxe apenas uma seção sobre elegibilidade, a primeira falha está na recuperação. Se trouxe o trecho correto e a resposta afirmou 30 dias mesmo assim, a geração ou a validação precisa ser revisada. Avaliar a evidência separadamente evita que uma resposta convincente esconda uma citação incompatível."]], "references": [["https://docs.langchain.com/oss/python/langchain/retrieval", "LangChain · contexto recuperado na geração de respostas"], ["https://www.asimov.academy/trilhas/aplicacoes-inteligentes-com-ia/", "Asimov · aplicações com bases de conhecimento"]]}]}, {"id": "05", "slug": "05-agentes-e-ferramentas", "title": "Agentes e uso de ferramentas", "hours": "12 h", "phase": "Construção", "goal": "Confiabilidade: limite de passos, orçamento, confirmação para atos sensíveis e trilha de execução.", "deliverable": "Criar agente que consulta uma base de FAQs e calcula prazos; chamadas de escrita devem exigir confirmação simulada.", "steps": [["Quando usar um agente", "Um fluxo fixo segue etapas programadas; um agente escolhe a próxima ação conforme objetivo e observações. Defina ferramentas disponíveis, condição de término, quantidade máxima de passos e o que o agente deve fazer quando não tiver dados. Use autonomia somente onde escolhas variáveis realmente ajudam.", "Para prazo simples, uma função direta pode bastar; um agente pode escolher entre buscar FAQ e calcular data."], ["Ferramentas com contratos", "Cada ferramenta deve declarar entradas, resultados e erros de maneira clara. Separe leitura de operações que alteram dados, aplique permissões mínimas e valide argumentos antes da execução. O resultado de uma busca é dado externo e pode conter instruções maliciosas que não devem ganhar autoridade.", "buscar_faq(termo) lê documentos; criar_lembrete(data) exige confirmação antes de escrever."], ["Limites e rastreabilidade", "Teste loops, retorno vazio e tentativa de induzir o agente por texto de documentos. Registre chamadas de ferramenta, decisões e custo sem expor conteúdo sensível. Limites de passos e aprovação para efeitos externos tornam possível interromper uma execução indevida.", "Um documento que pede “ignore as regras” deve ser tratado como conteúdo da busca."]], "videos": [{"title": "Agentes com Python e LangGraph", "url": "https://www.youtube.com/watch?v=PqS1kib7RTw", "id": "PqS1kib7RTw", "stage": 1, "script": "Desenhe objetivo, ferramentas e limite de passos. Para uma pergunta, mostre o agente escolhendo consultar FAQ e, se necessário, calcular prazo. Explique diferença entre leitura e escrita, confirmação e como interromper loop ou instrução maliciosa."}], "exercises": ["Criar agente que consulta uma base de FAQs e calcula prazos; chamadas de escrita devem exigir confirmação simulada.", "Testar 10 pedidos incluindo instrução maliciosa dentro de um documento e loop de chamadas."], "qa": [["Quando um workflow basta?", "Quando a sequência de passos é fixa e previsível."], ["O que o agente acrescenta?", "Escolha dinâmica de ações a partir do objetivo e observações."], ["Por que limite de passos?", "Para conter loops, custo e efeitos não desejados."], ["O que deve ter uma ferramenta?", "Contrato claro, validação, permissões mínimas e tratamento de erro."], ["Por que separar leitura e escrita?", "A escrita modifica estado e exige controle mais rigoroso."], ["O que é condição de parada?", "Regra para encerrar após resposta ou limite."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langchain/agents", "https://www.asimov.academy/trilhas/hermes-agent/"], "firstTopic": {"context": "Algumas perguntas do assistente exigem só uma busca. Outras pedem uma segunda ação, como calcular um prazo com base no que foi encontrado.", "cards": [["Quando um fluxo fixo é suficiente?", "Quando a sequência de passos já é conhecida e previsível."], ["O que um agente pode decidir durante a execução?", "Qual ação executar a seguir, com base no objetivo e no que já observou."]], "chapter": [["heading", "Quando a próxima ação é conhecida"], ["paragraph", "Uma consulta “Qual é o horário de atendimento?” pode seguir sempre a mesma sequência. A aplicação busca na FAQ, encontra a seção de horários e apresenta a resposta. Esse fluxo é previsível. O código sabe desde o início quais passos precisa executar. Uma pergunta como “Ainda estou no prazo para enviar meu pedido?” depende do que aparece durante a execução. Talvez seja preciso encontrar a regra, solicitar a data do pedido e só então calcular o prazo."], ["heading", "Como um agente usa ferramentas"], ["paragraph", "Um agente recebe um objetivo e uma lista de ferramentas disponíveis. Ele pode começar chamando a busca de FAQ. O resultado devolve a regra de prazo. Se a data está na conversa, o sistema pode chamar uma função de cálculo. Se a data não aparece, o próximo passo pode ser perguntar ao usuário. A aplicação executa as ferramentas, verifica os argumentos e devolve os resultados. Assim, a decisão sobre o próximo passo depende do que foi observado."], ["heading", "A execução precisa de um limite"], ["paragraph", "Se a busca não encontra uma regra, repetir a mesma consulta indefinidamente gasta tempo e recursos. Um sistema pode encerrar após um número pequeno de tentativas e informar qual informação falta. Outro limite separa consultar de alterar algo. Ler uma FAQ tem efeitos diferentes de criar um lembrete no calendário. A aplicação pode permitir a leitura e exigir confirmação antes de executar a segunda tarefa. A definição do objetivo, dos efeitos permitidos e do critério de término torna o agente previsível o suficiente para ser testado."]]}, "laterTopics": [{"chapter": [["heading", "O contrato descreve o que a ferramenta realmente faz"], ["paragraph", "buscar_faq(termo) pode exigir texto não vazio e retornar trechos com origem. criar_lembrete(data) precisa de uma data válida e altera um calendário. Os dois nomes descrevem funções diferentes, mas o contrato também precisa indicar argumentos, tipos, resultados e erros. “Não encontrado” e “serviço indisponível” são resultados distintos. O primeiro pode justificar pedir mais detalhes. O segundo indica que a consulta falhou."], ["heading", "A aplicação valida a ação antes de executar"], ["paragraph", "O modelo pode sugerir uma chamada, mas o programa que executa a ferramenta verifica os argumentos e as permissões. Se a ferramenta recebe uma data que o sistema não consegue interpretar, devolve um erro controlado. Se for preciso criar um lembrete, o aplicativo mostra o que será criado e solicita a confirmação adequada. O modelo não precisa ter acesso direto a credenciais do calendário para propor a ação."], ["heading", "O retorno fica no lugar de dado"], ["paragraph", "Uma página de FAQ pode conter texto que pareça uma instrução. O aplicativo entrega esse texto como conteúdo para análise. Permissões e regras de execução continuam sob responsabilidade da aplicação. Uma ferramenta de busca deve devolver a fonte junto com o trecho, para que o agente consiga citar a origem e a equipe consiga reproduzir por que determinada passagem foi considerada."]], "references": [["https://docs.langchain.com/oss/python/langchain/agents", "LangChain · ferramentas e o ciclo de execução do agente"]]}, {"chapter": [["heading", "Uma execução tem um orçamento de passos"], ["paragraph", "Se o agente busca a mesma pergunta três vezes e recebe o mesmo retorno vazio, insistir não acrescenta informação. Um limite de passos permite encerrar a execução e pedir um dado adicional ou explicar que não há evidência. Tempo e volume de chamadas também entram no orçamento. O mais útil é definir o que conta como progresso. Uma consulta reformulada que encontra uma fonte avança o trabalho. Repetir a mesma tentativa sem mudança indica um ciclo."], ["heading", "O registro explica como se chegou ao resultado"], ["paragraph", "Em uma consulta de prazos, um registro pode mostrar que houve busca na FAQ, leitura da passagem recuperada e cálculo com uma data informada. Para depurar a sequência, basta guardar o nome da ferramenta, a duração e o tipo de retorno, associados à execução. Credenciais e conteúdo privado não precisam aparecer nos logs. A aprovação de uma operação externa pode ter um registro separado que identifique a ação aprovada."], ["heading", "Teste comportamentos fora do caminho ideal"], ["paragraph", "Simule busca sem resultado e confira se o agente encerra dentro do limite. Simule uma ferramenta indisponível e verifique se a resposta distingue falha técnica de falta de evidência. Em uma fonte de teste que contenha uma instrução indevida, confira se o sistema mantém as permissões originais. Esses testes medem se a aplicação respeita seus limites quando os dados que chegam não são os esperados."]], "references": [["https://docs.langchain.com/oss/python/langchain/agents", "LangChain · controle da execução e tratamento de falhas em ferramentas"]]}]}, {"id": "06", "slug": "06-mcp-protocolo-e-integracoes", "title": "MCP: protocolo e integrações", "hours": "12 h", "phase": "Construção", "goal": "Controle: autorização, escopo, revisão de servidores, auditoria e tratamento de dados enviados a ferramentas.", "deliverable": "Criar servidor MCP com tool buscar_item e resource catálogo usando SDK oficial; conectar a cliente compatível.", "steps": [["Arquitetura MCP", "No MCP, um host usa um cliente para se conectar a um servidor que oferece capacidades. Tools executam funções, resources disponibilizam dados e prompts oferecem modelos reutilizáveis. O protocolo organiza descoberta e chamada; a lógica real da consulta ainda precisa ser implementada e autorizada.", "Servidor de catálogo oferece tool buscar_item e resource com dados públicos do catálogo."], ["Servidor e cliente", "Defina um esquema para os argumentos da ferramenta e devolva erros claros para entrada inválida ou item ausente. Execute o servidor com transporte adequado ao ambiente e teste a descoberta com um cliente compatível. Uma resposta previsível facilita integrar a capacidade ao assistente de documentação.", "buscar_item({\"id\":\"A1\"}) retorna nome e origem; ID ausente produz erro controlado."], ["Escopo e segurança", "Restrinja arquivos, dados e ações disponíveis ao servidor. Revise a origem de servidores conectados, credenciais e permissões de cada ferramenta. Registre o que foi chamado e garanta que o cliente não possa acessar itens fora do escopo autorizado.", "Teste pedido de item privado a partir de um cliente que só pode consultar itens públicos."]], "videos": [{"title": "Introdução oficial ao MCP, Anthropic", "url": "https://www.youtube.com/watch?v=CQywdSdi5iA", "id": "CQywdSdi5iA", "stage": 0, "script": "Apresente host, cliente e servidor. Explique as três capacidades MCP por exemplos: tool que procura item, resource que fornece catálogo e prompt reutilizável. Faça uma chamada conceitual com esquema de entrada e mostre erro de item inexistente e limite de acesso."}], "exercises": ["Criar servidor MCP com tool buscar_item e resource catálogo usando SDK oficial; conectar a cliente compatível.", "Testar argumentos inválidos, ausência de item e tentativa de acesso fora do escopo."], "qa": [["MCP substitui a API?", "Não; padroniza como o cliente descobre e usa capacidades expostas por servidores."], ["O que são tools?", "Ações invocáveis pelo cliente/modelo com contratos de entrada."], ["O que são resources?", "Dados que uma aplicação cliente pode carregar."], ["O que são prompts?", "Modelos de interação reutilizáveis."], ["Qual risco de servidor desconhecido?", "Acesso indevido ou exposição de dados e execução não pretendida."], ["Por que schema de argumentos?", "Para validar chamadas e documentar a interface."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://modelcontextprotocol.io/docs/learn/architecture", "https://py.sdk.modelcontextprotocol.io/get-started/first-steps/"], "firstTopic": {"context": "O assistente precisa consultar um catálogo sem conhecer todos os detalhes do sistema que armazena os itens. O MCP padroniza o acesso à capacidade de consulta.", "cards": [["Quem expõe as capacidades em MCP?", "O servidor MCP."], ["Qual é a diferença entre tool e resource?", "Uma tool executa uma função. Um resource disponibiliza dados para a aplicação cliente."]], "chapter": [["heading", "O problema de ligar uma aplicação a vários sistemas"], ["paragraph", "Um assistente de documentação precisa consultar um catálogo. Outro assistente também quer usar essa mesma consulta. Sem um contrato compartilhado, cada aplicação pode precisar aprender um formato de chamada diferente. MCP define como uma aplicação descobre capacidades apresentadas por um servidor e conversa com ele. O catálogo continua responsável pelos dados e regras que já possuía."], ["heading", "Host, cliente e servidor"], ["paragraph", "O host é a aplicação que o usuário usa, como o assistente de documentação. Dentro dela, um cliente MCP mantém a conexão com um servidor. O servidor apresenta as capacidades disponíveis. Se o usuário pergunta pelo item A1, o host pode usar o cliente para chamar a ferramenta buscar_item oferecida pelo servidor. A implementação da ferramenta consulta o catálogo e retorna o resultado por meio do protocolo."], ["heading", "Ação e dados têm papéis diferentes"], ["paragraph", "Uma ferramenta pode receber um identificador e devolver um item específico. Um recurso pode disponibilizar um catálogo ou documento que a aplicação queira ler. Um servidor também pode expor modelos reutilizáveis de interação por meio de prompts. Ao consultar A1, o retorno pode trazer nome e origem. Se A1 não existe, o servidor devolve um resultado controlado para essa situação. Definir os argumentos, o formato de resposta e os limites de acesso continua sendo tarefa da aplicação e do servidor."]]}, "laterTopics": [{"chapter": [["heading", "A descoberta informa que operações existem"], ["paragraph", "Um cliente MCP se conecta ao servidor de catálogo. Após estabelecer a conexão, pode descobrir que o servidor oferece buscar_item e ler a descrição dos argumentos esperados. O servidor pode exigir um objeto com o campo id, do tipo texto. A descrição ajuda o host a montar a chamada. A implementação do servidor ainda valida se recebeu um identificador no formato definido."], ["heading", "Do pedido do cliente ao resultado do catálogo"], ["paragraph", "Para {\"id\":\"A1\"}, o servidor chama a lógica de consulta e devolve nome e origem do item. Se id estiver ausente, a entrada é inválida. Se o formato estiver correto e A1 não existir, a consulta executou, mas não encontrou dados. Separar esses resultados permite ao assistente corrigir uma entrada incompleta ou explicar que o catálogo não contém o item. O cliente precisa interpretar cada resultado antes de montar uma resposta ao usuário."], ["heading", "Teste a conexão e a função separadamente"], ["paragraph", "Comece com um catálogo de teste que contenha A1. Confira se o cliente descobre a ferramenta, chama com um argumento válido e interpreta o retorno. Depois execute a própria lógica de consulta com A1 e com um item inexistente. Se a lógica funciona diretamente mas a ferramenta não aparece no cliente, a investigação começa na conexão ou no registro da capacidade. Se a ferramenta aparece mas devolve dados errados, a consulta do catálogo é o próximo ponto a examinar."]], "references": [["https://modelcontextprotocol.io/docs/learn/architecture", "MCP · arquitetura e papéis de host, cliente e servidor"], ["https://py.sdk.modelcontextprotocol.io/get-started/first-steps/", "SDK Python do MCP · primeiros passos"]]}, {"chapter": [["heading", "Um servidor só precisa das capacidades que oferece"], ["paragraph", "Se o assistente consulta um catálogo, o servidor pode usar uma conta de leitura restrita àquele catálogo. Dar acesso a arquivos de outros projetos aumenta o impacto de um erro sem ajudar a consulta. Aplique os limites na implementação, no sistema de dados e nas credenciais. As descrições das ferramentas explicam o que cada operação faz, mas não impõem sozinhas a autorização."], ["heading", "A permissão depende do usuário ou da aplicação"], ["paragraph", "Imagine itens públicos e privados. Um cliente com acesso ao catálogo público pede A9, que é privado. O servidor verifica o acesso antes de produzir o retorno. Se não houver autorização, ele segue a política definida para acesso negado e evita mostrar dados ou confirmar a existência do item quando isso for sensível. Um servidor conectado de terceiros também merece revisão, pois recebe argumentos e devolve conteúdo usado pelo host."], ["heading", "Teste e registre o controle de acesso"], ["paragraph", "Use duas identidades de teste. Confirme que ambas podem ler um item público e que somente a identidade autorizada lê o privado. Verifique a restrição mesmo se a chamada vier diretamente de um cliente de teste. Um registro pode indicar integração, identidade de serviço, operação e resultado sem armazenar a credencial ou o conteúdo privado. Assim fica possível confirmar que a restrição foi aplicada no servidor."]], "references": [["https://modelcontextprotocol.io/docs/learn/architecture", "MCP · escopo da comunicação entre o host e os servidores"]]}]}, {"id": "07", "slug": "07-langgraph-orquestracao-e-estado", "title": "LangGraph: estado e orquestração", "hours": "14 h", "phase": "Construção", "goal": "Avaliação: testar rotas, falhas de ferramentas, retomada e condição de encerramento.", "deliverable": "Criar grafo triagem → busca → revisão → resposta com desvio quando a evidência for fraca.", "steps": [["Estado, nós e rotas", "Um grafo representa etapas como nós e transições como arestas; o estado carrega dados necessários durante a execução. Cada nó lê o estado e devolve atualizações. Arestas condicionais escolhem o próximo passo, por exemplo revisão humana quando a evidência é insuficiente.", "triagem → busca → revisão ou resposta, conforme a qualidade da evidência."], ["Retomada e aprovação", "Um checkpoint grava estado para continuar uma execução identificada por thread. Antes de retomar, defina quais efeitos podem ser repetidos: escrita duplicada precisa de chave de idempotência ou verificação prévia. Um ponto de aprovação permite interromper o fluxo antes de uma ação sensível.", "Ao retomar após aprovação, a mesma publicação não deve ocorrer duas vezes."], ["Testes do fluxo", "Teste cada rota com estados de exemplo: evidência boa, evidência fraca, erro de ferramenta e interrupção. Verifique onde o grafo termina e o que acontece quando a revisão rejeita a resposta. Logs de nós ajudam a entender o caminho percorrido.", "Uma pergunta sem trecho relevante deve seguir para revisão ou responder “não sei”."]], "videos": [{"title": "What is LangGraph?, canal oficial", "url": "https://www.youtube.com/watch?v=4iYOJ6gyQV4", "id": "4iYOJ6gyQV4", "stage": 0, "script": "Mostre estado inicial com pergunta, um nó de triagem, um nó de busca e uma rota de revisão. Atualize o estado após cada nó e explique por que a transição depende da evidência. Termine com checkpoint e retomada sem repetir uma escrita."}, {"title": "RAG avançado com LangGraph", "url": "https://www.youtube.com/watch?v=sVcwVQRHIc8", "id": "sVcwVQRHIc8", "stage": 1, "script": "Reaproveite o exemplo de busca do módulo RAG e represente-o como nós do grafo. Mostre rota de evidência fraca, revisão humana e teste de retomada. Observe que este roteiro é uma aplicação do conceito de grafo, independentemente do título do vídeo indicado."}], "exercises": ["Criar grafo triagem → busca → revisão → resposta com desvio quando a evidência for fraca.", "Adicionar checkpoint e ponto de aprovação simulado; testar retomada sem duplicar uma ação."], "qa": [["O que é estado no grafo?", "Dados compartilhados atualizados pelos nós da execução."], ["Para que serve aresta condicional?", "Escolher o próximo nó segundo uma condição explícita."], ["O que o checkpoint guarda?", "Estado para retomar execução em uma thread."], ["Por que idempotência?", "Para evitar duplicar efeitos quando uma etapa é repetida."], ["Onde colocar revisão humana?", "Antes de ações com impacto ou baixa confiança."], ["Quando LangGraph é útil?", "Quando há rotas, estado, pausas ou retomadas além de uma cadeia simples."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langgraph/overview", "https://docs.langchain.com/oss/python/langgraph/persistence"], "firstTopic": {"context": "Uma resposta pode seguir direto para o usuário quando a evidência é forte ou passar por revisão quando faltam dados. O grafo representa esses caminhos.", "cards": [["O que um nó faz com o estado?", "Lê os dados de que precisa e devolve atualizações."], ["Para que serve uma aresta condicional?", "Para escolher o próximo nó de acordo com uma condição."]], "chapter": [["heading", "A pergunta pode seguir por caminhos diferentes"], ["paragraph", "Considere um assistente que responde a partir de documentos. Ele começa identificando a pergunta e busca evidências. Quando encontra um trecho suficiente, redige uma resposta. Se não encontra, encaminha a conversa para revisão ou informa a falta de evidência. Um grafo torna esses caminhos explícitos. Cada nó executa uma etapa e cada aresta define para onde o fluxo pode seguir."], ["heading", "O estado transporta o resultado de uma etapa para outra"], ["paragraph", "O estado pode começar com a pergunta. Depois da busca, passa a incluir uma lista de trechos com suas fontes. O nó de avaliação lê essa lista, analisa se os trechos sustentam uma resposta e acrescenta uma decisão. O nó seguinte usa essa decisão. Esse compartilhamento permite testar um nó com entradas conhecidas e observar exatamente o que ele adiciona ou modifica."], ["heading", "Uma condição define o desvio"], ["paragraph", "Imagine que a pergunta seja “Qual o prazo para pedir férias?” e a busca só encontre um trecho sobre quem pode pedir férias. O nó de evidência marca o resultado como insuficiente. A aresta condicional desvia para revisão. Se o trecho disser o prazo e vier da versão aplicável, a mesma etapa autoriza o caminho de resposta. Em ambos os casos, o grafo registra por onde executou. Se for necessário interromper e retomar o trabalho por aprovação humana, a persistência do estado permite continuar de um ponto conhecido."]]}, "laterTopics": [{"chapter": [["heading", "Pausar uma execução sem perder sua posição"], ["paragraph", "Um fluxo pode recuperar um trecho e aguardar que alguém aprove a publicação da resposta. Nesse momento, a pergunta, a evidência e a etapa pendente precisam ficar registradas. Um checkpoint representa um estado que pode ser recuperado durante a execução. Uma thread identifica a sequência à qual esse estado pertence. Ao aprovar, a aplicação precisa apontar para a thread correta, senão pode retomar a pergunta errada."], ["heading", "A aprovação precisa referenciar a proposta"], ["paragraph", "Se o usuário aprova a resposta A, a retomada deve usar aquela proposta ou pedir nova aprovação caso o conteúdo mude. Persistir uma decisão sem gravar o texto ou sua versão dificulta provar o que foi autorizado. O ponto de pausa deve ficar antes da publicação, e o trecho de código anterior à pausa deve tolerar reexecução de acordo com o mecanismo de retomada utilizado."], ["heading", "Evite repetir uma ação externa"], ["paragraph", "Imagine que a publicação A foi enviada, mas o processo caiu antes de gravar o sucesso. Ao retomar, uma segunda tentativa pode publicar de novo. A aplicação pode dar à publicação um identificador de operação e fazer o destino reconhecer repetições. Em um teste, simule duas tentativas com o mesmo identificador e confira se há apenas uma publicação. Um checkpoint ajuda a retomar o fluxo. A idempotência trata o efeito externo duplicado."]], "references": [["https://docs.langchain.com/oss/python/langgraph/persistence", "LangGraph · checkpoints, threads e retomada"]]}, {"chapter": [["heading", "Um grafo é testado por seus caminhos"], ["paragraph", "Monte entradas que levem a estados diferentes. Uma pergunta com evidência adequada deve seguir pelo nó de resposta. Outra sem fonte relevante deve pausar para revisão ou terminar informando a falta de evidência, conforme a regra escolhida. Uma falha de ferramenta precisa acionar o tratamento de erro, em vez de produzir uma resposta que pareça usar dados que nunca chegaram."], ["heading", "Observe a transição e o resultado"], ["paragraph", "Em um teste, faça o nó de busca devolver um trecho conhecido e confira se o nó de evidência grava a decisão esperada. Em outro, use uma condição que force a interrupção. Confirme que o estado salvo mantém a pergunta e que o fluxo retoma da thread correta. Uma revisão rejeitada também precisa de um destino definido. Pode voltar para ajuste ou terminar com a recusa registrada."], ["heading", "O registro mostra onde a execução mudou de rumo"], ["paragraph", "Um log dos nós percorridos, da duração e do resultado resume o caminho sem gravar dados sensíveis. Se a resposta foi enviada sem revisão, confira o valor que a condição recebeu. Se o fluxo ficou preso, procure transições que retornam ao mesmo nó e verifique o limite de tentativas. Testar o caminho interno e a resposta final permite localizar
