uma falha que um teste apenas da tela deixaria passar."]], "references": [["https://docs.langchain.com/oss/python/langgraph/overview", "LangGraph · estrutura e execução de grafos"], ["https://docs.langchain.com/oss/python/langgraph/persistence", "LangGraph · persistência para testes de retomada"]]}]}, {"id": "08", "slug": "08-hermes-e-openclaw", "title": "Hermes Agent e OpenClaw", "hours": "8 h", "phase": "Construção", "goal": "Segurança: limitar diretórios, segredos e integrações; exigir aprovação para envio externo e escrita.", "deliverable": "Especificar rotina de resumo de arquivos de teste locais em ambos os ambientes (ou em um deles).", "steps": [["Comparar agentes pessoais", "Observe workspace, memória, ferramentas, skills e canais de cada sistema usando arquivos de teste. Faça uma tabela do que cada ambiente lê, armazena e executa. A experiência varia conforme versão e configuração; confirme comandos de instalação na documentação atual antes de usar.", "Teste um resumo de três arquivos fictícios em diretório isolado."], ["Rotina automatizada", "Uma automação tem gatilho, entrada, processamento, saída e condição de parada. Configure uma rotina local de resumo e registre quando dispara, o que ela acessa, quanto custa e o que acontece quando a entrada está vazia. Separe o agendamento da liberdade de decidir ações durante a execução.", "Todo dia, resumir arquivos de teste novos; sem arquivos, registrar “nada a processar”."], ["Limites de acesso", "Permita acesso apenas à pasta de teste e evite inserir segredos em prompts ou logs. Envio externo e escrita exigem verificação explícita. Compare como cada sistema permite revisar memória, auditar execução e cancelar uma rotina.", "Um pedido para ler outra pasta deve falhar ou solicitar autorização antes de prosseguir."]], "videos": [{"title": "Tutorial Hermes Agent, português", "url": "https://www.youtube.com/watch?v=sYMG1JHaPJc", "id": "sYMG1JHaPJc", "stage": 0, "script": "Em ambiente isolado, liste workspace, memória, skills e ferramentas. Descreva uma automação de resumo de arquivos de teste, seu gatilho e como auditar o resultado. Antes de usar comandos de instalação, consulte documentação oficial atual."}, {"title": "Tutorial de OpenClaw para iniciantes, português", "url": "https://www.youtube.com/watch?v=qmP7WvbnQvI", "id": "qmP7WvbnQvI", "stage": 1, "script": "Compare a mesma rotina em OpenClaw: entrada, agendamento, diretório permitido, resultado e log. Mostre o caso em que a rotina tenta acessar outra pasta e como bloquear ou pedir autorização. Consulte a documentação oficial atual para passos de instalação."}], "exercises": ["Especificar rotina de resumo de arquivos de teste locais em ambos os ambientes (ou em um deles).", "Documentar instalação consultando instruções oficiais atuais e comparar controle de acesso, memória e manutenção."], "qa": [["O que é uma skill neste contexto?", "Um procedimento reutilizável para orientar a execução."], ["O que deve ser limitado no workspace?", "Arquivos, segredos e recursos que o agente pode acessar."], ["Qual diferença entre automação e autonomia?", "Automação dispara rotina; autonomia envolve decisões dentro de limites."], ["Por que iniciar com dados de teste?", "Para entender efeitos antes de acesso a contas ou dados reais."], ["Que pergunta fazer antes de conectar mensagens?", "Quais dados serão lidos e quais ações podem ser enviadas?"], ["Como comparar duas plataformas?", "Pelo mesmo cenário, permissões, custo, logs e resultado."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://www.asimov.academy/trilhas/hermes-agent/", "https://www.asimov.academy/trilhas/openclaw/"], "firstTopic": {"context": "Hermes Agent e OpenClaw podem automatizar tarefas pessoais. Para compará-los, use o mesmo conjunto de arquivos fictícios e observe o que cada ambiente consegue acessar.", "cards": [["O que é uma skill nesse contexto?", "Uma orientação reutilizável para executar uma tarefa."], ["O que deve ser limitado no workspace de teste?", "Os arquivos, recursos e segredos acessíveis ao agente."]], "chapter": [["heading", "O que muda ao dar ferramentas a um assistente pessoal"], ["paragraph", "Um assistente de conversa opera sobre o que recebe na conversa. Um agente pessoal configurado com ferramentas pode ler arquivos, chamar integrações ou registrar resultados. O workspace estabelece um local de trabalho. A memória pode guardar informações para outra execução. Uma skill descreve um procedimento reutilizável, como reunir resumos sempre no mesmo formato. As ferramentas executam ações concretas."], ["heading", "A mesma tarefa mostra diferenças de configuração"], ["paragraph", "Imagine um diretório de teste com três notas fictícias. A tarefa é produzir um resumo de uma linha por nota. Se o agente consegue localizar as três notas e retorna somente as três linhas, o teste mostra que leitura e resumo funcionaram naquele cenário. Em outro teste, uma nota cita um caminho fora do diretório. O comportamento esperado é que o agente trabalhe com os arquivos permitidos e reporte a falta de acesso quando necessário."], ["heading", "O que observar além da qualidade do resumo"], ["paragraph", "Na comparação entre Hermes Agent e OpenClaw, vale registrar quais arquivos foram abertos, se alguma informação persistiu entre execuções e se o resumo ficou na conversa ou foi salvo em arquivo. Esses resultados dependem das permissões e das ferramentas ativadas, por isso o mesmo pedido pode gerar efeitos diferentes. Uma comparação útil usa o mesmo material de teste e deixa claro o alcance de cada execução. No tópico seguinte, o gatilho programado introduz o que muda quando a tarefa roda sem um pedido manual."]]}, "laterTopics": [{"chapter": [["heading", "Um horário inicia o trabalho"], ["paragraph", "Imagine uma rotina diária que resume os arquivos novos de uma pasta de teste. O agendador decide quando iniciar, por exemplo, às 9h de um fuso definido. A própria rotina decide quais arquivos entram no lote. Ela pode manter uma lista dos nomes ou identificadores processados e selecionar apenas o que ainda não foi resumido. Isso evita repetir o mesmo trabalho todos os dias."], ["heading", "Defina uma saída e um ponto de parada"], ["paragraph", "Se houver dois novos arquivos, a execução pode escrever um resumo de uma linha para cada um, em arquivo local. Se não houver novos itens, registra “nada a processar” e termina. Se houver centenas, um limite de itens ou de tempo impede que uma execução ocupe indefinidamente os recursos do ambiente. O limite precisa prever o destino dos itens ainda pendentes para que possam ser tratados depois."], ["heading", "Confira o que realmente aconteceu"], ["paragraph", "Teste três situações com dados fictícios. Na primeira, o agendador inicia a rotina e um arquivo novo aparece no relatório. Na segunda, a pasta não muda e nenhum item é resumido. Na terceira, um arquivo não pode ser lido e o erro fica registrado com contexto suficiente para investigar. Um registro com horário, quantidade e resultado ajuda a saber se o gatilho disparou e se a rotina completou o trabalho."]], "references": [["https://www.asimov.academy/trilhas/hermes-agent/", "Asimov · Hermes Agent e automação de tarefas"], ["https://www.asimov.academy/trilhas/openclaw/", "Asimov · OpenClaw e gestão de tarefas"]]}, {"chapter": [["heading", "Dê acesso ao que a rotina precisa"], ["paragraph", "Para resumir notas em um diretório de teste, o processo precisa ler esse diretório. Se for escrever o resultado, dê permissão apenas na pasta de saída. Um acesso amplo à máquina não melhora a qualidade do resumo. Teste uma tentativa de ler um arquivo de fora do escopo com arquivos fictícios. A rotina deve rejeitar o acesso ou seguir o fluxo de autorização definido."], ["heading", "Memória e integrações também têm escopo"], ["paragraph", "Um agente pode guardar dados de uma execução para reutilizar depois. Antes de usar essa função, observe o que fica salvo, por quanto tempo e como apagar ou revisar o conteúdo. Uma integração de envio acrescenta outro efeito. Se a rotina apenas produz um resumo local, um canal externo não precisa estar habilitado. Se a função de envio foi autorizada, verifique destinatário e conteúdo antes do ato."], ["heading", "Revise o que acontece quando a rotina é encerrada"], ["paragraph", "Mantenha um modo de desativar o agendamento e confira que uma tarefa já iniciada pode ser interrompida ou terminar sem gerar novos efeitos. Use registros para descobrir quando a execução começou, quais pastas consultou e quais saídas produziu. Na comparação entre ambientes, registre as permissões efetivas observadas em teste, porque configurações diferentes podem mudar mais o resultado que o nome do produto."]], "references": [["https://www.asimov.academy/trilhas/hermes-agent/", "Asimov · configuração de agentes no Hermes"], ["https://www.asimov.academy/trilhas/openclaw/", "Asimov · configuração de agentes no OpenClaw"]]}]}, {"id": "09", "slug": "09-avaliacao-seguranca-e-observabilidade", "title": "Avaliação, segurança e observabilidade", "hours": "12 h", "phase": "Produção", "goal": "Observabilidade: logs, traces, latência, custo por tarefa, taxa de falha e regressões.", "deliverable": "Criar conjunto de 30 questões rotuladas (incluindo 5 casos adversariais) e medir resultado antes/depois de uma mudança.", "steps": [["Avaliação repetível", "Crie perguntas com resposta esperada, trechos de referência e rubrica de avaliação. Mantenha um conjunto fixo para comparar versões; separe acerto da resposta, qualidade da citação e adequação de uma recusa. Revise manualmente amostras quando uma métrica automática for ambígua.", "Pergunta sem resposta no acervo é aprovada somente se o assistente reconhecer a lacuna."], ["Ameaças e permissões", "Prompt injection aparece quando um documento, página ou resultado de ferramenta tenta controlar o assistente. Verifique a autorização no servidor antes da recuperação de dados e novamente antes de ações. Teste vazamento entre usuários, entradas maliciosas e segredo acidental em logs.", "Documento de usuário A não pode aparecer em resposta para usuário B."], ["Traces e regressões", "Um trace registra as etapas de uma solicitação e seus tempos. Meça latência, falha, uso de tokens e custo por tarefa sem guardar dados privados desnecessários. Depois de qualquer mudança, execute o mesmo conjunto de avaliação para detectar melhorias e regressões.", "Antes/depois: acerto 21/30 → 24/30; confira quais três casos melhoraram e se outros pioraram."]], "videos": [{"title": "RAG em produção e observabilidade", "url": "https://www.youtube.com/watch?v=mHxLXzYjQRE", "id": "mHxLXzYjQRE", "stage": 2, "script": "Prepare um conjunto de perguntas e respostas de referência. Mostre uma execução completa com busca, resposta, citação, latência e custo. Compare uma mudança antes/depois, investigue erros e inclua um documento com tentativa de prompt injection."}], "exercises": ["Criar conjunto de 30 questões rotuladas (incluindo 5 casos adversariais) e medir resultado antes/depois de uma mudança.", "Adicionar trace sem conteúdo sensível e testes de acesso cruzado entre usuários."], "qa": [["Por que conjunto fixo de avaliação?", "Permite comparar versões no mesmo cenário."], ["O que é prompt injection?", "Instrução hostil inserida em dados menos confiáveis."], ["Qual métrica valida citação?", "Se o trecho citado sustenta diretamente a afirmação."], ["Por que medir custo por tarefa?", "Para projetar viabilidade e detectar desvios."], ["Como evitar vazamento entre usuários no RAG?", "Filtrar acesso antes da recuperação e verificar autorização."], ["O que fazer após uma regressão?", "Investigar casos falhos e reverter ou corrigir com evidência."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://genai.owasp.org/llm-top-10/", "https://docs.langchain.com/langsmith/evaluation"], "firstTopic": {"context": "Uma resposta convincente pode citar a fonte errada. Uma avaliação fixa permite comparar versões sem depender da impressão de uma única conversa.", "cards": [["Por que manter um conjunto fixo de avaliação?", "Para comparar diferentes versões nas mesmas condições."], ["O que torna uma citação adequada?", "O trecho citado sustenta diretamente a afirmação apresentada."]], "chapter": [["heading", "Uma boa resposta precisa passar de um exemplo isolado"], ["paragraph", "Uma demonstração pode escolher a pergunta que o assistente sabe responder melhor. Para avaliar o produto, é mais útil montar um conjunto fixo de perguntas, com respostas esperadas e as fontes que sustentam cada uma. Inclua também perguntas que o acervo não consegue responder. As mesmas entradas podem ser executadas depois de uma alteração e permitem comparar os resultados."], ["heading", "Resposta correta e fonte adequada têm critérios diferentes"], ["paragraph", "Imagine uma base em que a política de férias válida informa 45 dias. A resposta “45 dias” parece correta, mas pode citar uma seção que trata somente de elegibilidade. A avaliação deve registrar duas coisas separadas. O prazo está correto e a citação falhou. Se a política não estiver disponível, a resposta adequada é reconhecer a ausência de evidência. A rubrica define essas condições antes do teste para que a interpretação não mude entre versões."], ["heading", "O resultado orienta a investigação"], ["paragraph", "Suponha que a primeira versão acerte 21 de 30 perguntas e a segunda acerte 24. A contagem ajuda, mas diz pouco sobre a causa. Compare os casos para descobrir quais fontes passaram a aparecer, quais respostas mudaram e se algum acerto foi perdido. Se o trecho certo não apareceu, a investigação começa na busca. Se o trecho estava presente e o modelo ignorou uma condição explícita, a falha está na geração ou na validação da resposta."]]}, "laterTopics": [{"chapter": [["heading", "Documentos fornecem conteúdo à resposta"], ["paragraph", "Um assistente recupera textos da base para responder perguntas. Alguns desses textos podem ter instruções dirigidas ao leitor ou a um sistema. A aplicação trata o trecho recuperado como material a interpretar. As permissões continuam sendo decididas pelo servidor. Isso é relevante para prompt injection, situação em que conteúdo inserido nos dados tenta influenciar as instruções seguidas pelo modelo."], ["heading", "Verifique a autorização em cada fronteira"], ["paragraph", "Se a pessoa B procura um termo que só aparece em documentos da pessoa A, a aplicação precisa aplicar o filtro de acesso na busca. Se o mesmo assistente pode executar ferramentas, o servidor também deve conferir a permissão antes de qualquer ação. O texto gerado e a sugestão do modelo não concedem acesso. Usar identidades simuladas permite validar o controle sem expor documentos reais."], ["heading", "Verifique o que é exibido e o que é registrado"], ["paragraph", "Além da resposta, observe citações, erros e logs. Uma recusa pode estar correta, mas um log acessível a usuários pode expor detalhes do documento. Defina quais campos ficam visíveis a cada pessoa e mantenha segredos fora das mensagens e dos registros. Um teste defensivo simples troca de identidade e compara os resultados permitidos com os que realmente apareceram em cada superfície."]], "references": [["https://genai.owasp.org/llm-top-10/", "OWASP · riscos de aplicações com modelos de linguagem e prompt injection"]]}, {"chapter": [["heading", "Um trace mostra a trajetória da solicitação"], ["paragraph", "Ao pedir uma resposta de RAG, a aplicação pode passar por busca, seleção de trechos e geração. Um trace liga essas etapas à mesma solicitação. Uma medição de 4 segundos, por exemplo, ganha significado se a busca consumiu 200 milissegundos e a geração ocupou quase todo o restante. Se a busca não encontrou nada, o trace também mostra se a aplicação gerou uma resposta depois de receber a lista vazia."], ["heading", "Registre métricas e preserve a privacidade"], ["paragraph", "Tempo, quantidade de candidatos, tokens, classe do erro e identificadores ajudam a diagnosticar uma regressão. Em muitos casos, bastam esses metadados. Evite gravar o texto integral da pergunta ou o conteúdo privado do acervo quando o objetivo pode ser alcançado sem eles. Para interpretar latência, meça a distribuição. Uma média esconde parte dos casos lentos que o p95 ajuda a observar."], ["heading", "A melhoria deve aparecer no mesmo conjunto de casos"], ["paragraph", "Uma versão passa de 21 para 24 acertos em 30 perguntas. Compare a lista de acertos por item. Pode ter corrigido quatro e quebrado um anterior. Use o trace do caso que piorou para descobrir se a busca perdeu a fonte, se o modelo ignorou o trecho ou se a validação mudou. Depois relacione o ganho em acerto ao custo e ao tempo de resposta. A decisão depende do comportamento completo do sistema."]], "references": [["https://docs.langchain.com/langsmith/evaluation", "LangSmith · conjuntos de avaliação e comparação de experimentos"], ["https://sre.google/sre-book/monitoring-distributed-systems/", "Google SRE · latência, tráfego, erros e saturação"]]}]}, {"id": "10", "slug": "10-fine-tuning-e-decisao", "title": "Fine tuning: quando fazer", "hours": "12 h", "phase": "Produção", "goal": "Experimento: estudar SFT com LoRA/QLoRA, licenças, custo de GPU, qualidade do dataset, overfitting e comparação com baseline.", "deliverable": "Criar tabela de decisão para cinco problemas: conhecimento atualizado, estilo, formato, ação externa e custo/latência.", "steps": [["Diagnosticar o problema", "Meça o sistema atual antes de mudar de técnica. Falta de informação atual e citável aponta para recuperação; necessidade de consultar ou alterar sistemas aponta para ferramenta. Ajuste prompt e validação primeiro quando o problema é formato ou instrução instável.", "Se a resposta depende de um regulamento alterado ontem, indexe e cite a versão atual."], ["Dados para ajuste fino", "Fine tuning supervisionado ensina padrões por exemplos de entrada e saída. Organize exemplos representativos, autorizados e revisados; separe treino, validação e teste por origem para reduzir vazamento. Um ajuste de comportamento não substitui uma fonte atualizada para fatos que mudam.", "Treine padrão de redação com casos fictícios; avalie em casos de origem diferente."], ["Experimento e decisão", "LoRA e QLoRA são formas de adaptar modelos com menor custo de recursos, mas ainda exigem ambiente e avaliação adequados. Compare baseline, prompt aprimorado e ajuste no mesmo teste, com qualidade, latência e custo total. Se não houver GPU ou dados suficientes, a entrega pode ser a decisão experimental fundamentada.", "Uma melhora pequena em formato pode não compensar treinamento e manutenção."]], "videos": [{"title": "Fine tuning e LoRA, introdução", "url": "https://www.youtube.com/watch?v=ug9el1OGGEw", "id": "ug9el1OGGEw", "stage": 2, "script": "Descreva quando faltam fatos, quando falta ferramenta e quando falta consistência de formato. Explique com exemplos o que um ajuste supervisionado aprende; separe dados de treino e teste. Compare ganho em qualidade com custo e mantenha decisão sem treino caso faltem recursos."}], "exercises": ["Criar tabela de decisão para cinco problemas: conhecimento atualizado, estilo, formato, ação externa e custo/latência.", "Preparar 50 pares fictícios licenciados; separar treino/validação/teste por origem; executar treino pequeno somente se houver GPU e avaliar contra prompt e RAG."], "qa": [["Quando RAG é primeira escolha?", "Quando a resposta depende de fatos/documentos atualizados e rastreáveis."], ["Quando ferramentas são primeira escolha?", "Quando o sistema precisa consultar ou alterar estado externo."], ["Quando fine tuning pode ajudar?", "Quando exemplos de qualidade ensinam comportamento repetível que prompts não estabilizaram."], ["Fine tuning insere fatos atualizados de forma confiável?", "Não; dados mudam e o modelo não garante citação ou atualização."], ["Por que separar teste por origem?", "Para reduzir vazamento de exemplos muito parecidos."], ["Qual decisão vem antes do treino?", "Comparar com baseline e definir métrica e ganho esperado."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://huggingface.co/docs/trl/sft_trainer", "https://huggingface.co/docs/trl/peft_integration"], "firstTopic": {"context": "O assistente pode falhar por falta de informação, por falta de integração ou por inconsistência de comportamento. Cada causa pede uma intervenção diferente.", "cards": [["Quando RAG costuma ser a primeira opção?", "Quando a resposta depende de fatos atuais ou documentos rastreáveis."], ["O que medir antes de testar fine tuning?", "A qualidade, o custo e os erros do sistema atual em um conjunto de casos representativos."]], "chapter": [["heading", "Diagnosticar a falha antes de mudar o modelo"], ["paragraph", "Suponha que o assistente responda sobre uma política antiga. Pode ser que o acervo ainda não tenha a versão atual. Nesse caso, mudar os exemplos de treinamento não resolve a necessidade de citar uma fonte que muda. Recuperar a política vigente para cada consulta resolve uma parte diferente do problema. Se o assistente precisa saber o status de um pedido em tempo real, a necessidade é consultar o sistema que guarda esse status."], ["heading", "Quando a dificuldade é de comportamento"], ["paragraph", "Imagine que o sistema já receba os dados corretos, mas oscile entre diferentes estilos e estruturas de resposta. Primeiro vale testar instruções, exemplos e validação de formato. Se o padrão continua inconsistente em muitos casos, pode ser útil experimentar fine tuning supervisionado. Exemplos de entrada e saída ensinam o modelo a produzir um comportamento parecido. A avaliação precisa mostrar se esse padrão também aparece em casos diferentes dos usados no treino."], ["heading", "O baseline permite comparar"], ["paragraph", "Separe um conjunto de solicitações e rode a versão atual. Registre, por exemplo, quantas respostas respeitam o formato e quantas preservam os fatos da fonte. Rode as mesmas solicitações com um prompt revisado e, se houver dados suficientes, com o modelo ajustado. Se o formato melhora mas os fatos pioram, o resultado precisa ser avaliado pelas duas medidas. Também há custo e manutenção. Um ajuste só faz sentido quando o ganho medido atende à necessidade que motivou o teste."]]}, "laterTopics": [{"chapter": [["heading", "Exemplos ensinam um comportamento específico"], ["paragraph", "Suponha que um assistente de suporte já receba os fatos corretos, mas varie muito na forma de responder. Um exemplo de treino pode conter a mensagem do cliente e uma resposta que segue o padrão escolhido. Se as respostas de treino são inconsistentes entre si, o modelo recebe sinais contraditórios. Defina antes quais características fazem parte do padrão, como tom, estrutura e tratamento de dados ausentes."], ["heading", "Separe conjuntos antes de ajustar o modelo"], ["paragraph", "O conjunto de treino orienta o ajuste. A validação serve para comparar escolhas durante o experimento. O teste final mede o comportamento em entradas reservadas. Mensagens quase idênticas do mesmo atendimento podem criar uma impressão exagerada de qualidade se ficarem separadas só por sorteio. Organizar por origem, conversa ou grupo de casos reduz a chance de o teste reencontrar exemplos muito parecidos com os de treino."], ["heading", "Examine a qualidade e a permissão de uso"], ["paragraph", "Use exemplos autorizados e sem credenciais ou dados pessoais desnecessários. Confira se cada resposta respeita a tarefa definida e se situações raras aparecem o suficiente para serem avaliadas. Se o assistente precisa citar regulamentos atualizados, a fonte ainda precisa estar disponível no momento da consulta. Os dados de ajuste podem ensinar o padrão de redação. A evidência factual que muda é tratada no acervo."]], "references": [["https://huggingface.co/docs/trl/sft_trainer", "Hugging Face · dados e fluxo de ajuste supervisionado"]]}, {"chapter": [["heading", "Compare opções com o mesmo critério"], ["paragraph", "Use as mesmas perguntas reservadas para avaliar o sistema atual, o prompt melhorado e o modelo ajustado. Mantenha o restante do ambiente comparável. Registre qualidade de resposta, respeito ao formato, tempo e custo. Se uma versão muda simultaneamente a busca, as instruções e o modelo, fica difícil atribuir o ganho a qualquer dessas mudanças."], ["heading", "O ajuste pode operar sobre um conjunto menor de parâmetros"], ["paragraph", "LoRA usa adaptadores com poucos parâmetros adicionais em relação ao modelo completo. QLoRA combina adaptadores com um modelo base quantizado para reduzir a memória exigida durante o ajuste. Essas abordagens tornam alguns experimentos mais viáveis, mas ainda dependem de hardware, dados e avaliação. A regra é medir a qualidade resultante e prever como a equipe vai carregar, testar e atualizar o modelo ajustado."], ["heading", "Uma melhora pequena pode ter custo grande"], ["paragraph", "Imagine que o modelo atual respeita o formato em 92% dos casos e o ajustado em 94%, mas exige infraestrutura adicional e perde qualidade nas respostas sem evidência. O ganho isolado de dois pontos não decide a adoção. Defina antes quais métricas precisam melhorar e quais não podem cair. Se o experimento não puder ser executado, a decisão deve deixar claro quais dados ou recursos faltam para comparar as opções."]], "references": [["https://huggingface.co/docs/trl/peft_integration", "Hugging Face · integração de adaptadores com TRL"], ["https://huggingface.co/docs/peft/developer_guides/quantization", "Hugging Face · quantização e adaptação de modelos"]]}]}, {"id": "11", "slug": "11-deploy-llmops-e-custo", "title": "Deploy, LLMOps e custo", "hours": "10 h", "phase": "Produção", "goal": "Custo: tokens por tarefa, custo de busca e infraestrutura, latência p95, rollback e monitoramento.", "deliverable": "Empacotar a aplicação em container e criar pipeline que rode testes sem chave real.", "steps": [["Preparar para produção", "Empacote a aplicação de forma reproduzível, separe configuração por ambiente e execute testes de contrato na integração contínua. Não coloque chaves na imagem ou no repositório. Planeje rota de saúde e uma forma de voltar à versão anterior.", "O mesmo container executa localmente e no ambiente de demonstração com configurações diferentes."], ["Operar com limites", "Configure timeout, fila e limites por usuário para evitar saturação. Retry precisa ser controlado: repetir uma escrita sem idempotência pode duplicar efeitos. Versões de prompt, modelo e índice ajudam a explicar mudanças; cache requer política de atualização quando documentos mudam.", "Pedido duplicado de publicação recebe a mesma chave de operação, evitando duas gravações."], ["Medir custo e recuperação", "Some custo de entrada e saída do modelo, indexação, busca e infraestrutura. Meça latência p95 e taxa de erro por tipo; simule indisponibilidade do provedor e verifique o fallback. Estime orçamento por 1.000 requisições usando hipóteses explícitas, depois substitua por medidas reais.", "Se 1.000 chamadas consomem X tokens de entrada e Y de saída, calcule cada parcela com a tarifa vigente."]], "videos": [{"title": "RAG em produção, implantação e custo", "url": "https://www.youtube.com/watch?v=mHxLXzYjQRE", "id": "mHxLXzYjQRE", "stage": 2, "script": "Siga uma solicitação do container até a busca e o modelo. Mostre como medir tokens, tempo e erro; simule falha do provedor e indique fallback. Explique por que o custo por mil pedidos inclui busca e infraestrutura."}, {"title": "FastAPI básico", "url": "https://www.youtube.com/watch?v=BtIy2aD8k_w", "id": "BtIy2aD8k_w", "stage": 0, "script": "Apresente uma rota FastAPI já conhecida e seus testes de contrato. Empacote o serviço, configure segredos por ambiente e explique como o pipeline verifica a aplicação antes do deploy."}], "exercises": ["Empacotar a aplicação em container e criar pipeline que rode testes sem chave real.", "Simular falha de provedor, definir fallback e registrar orçamento por 1000 requisições."], "qa": [["O que CI deve verificar?", "Testes, lint e contratos relevantes antes da integração."], ["Por que versionar prompts?", "Para explicar mudanças e associar resultados a versões."], ["Quando retry é perigoso?", "Quando repete uma operação de escrita não idempotente."], ["O que é p95 de latência?", "Tempo abaixo do qual ficam 95% das solicitações."], ["Como evitar custo sem limite?", "Definir orçamento, limite de chamadas/tokens e alertas."], ["O que deve permitir rollback?", "Uma versão anterior verificável da aplicação e configuração."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.docker.com/get-started/", "https://docs.github.com/actions"], "firstTopic": {"context": "Uma aplicação que funciona no computador do desenvolvedor precisa ser reproduzível no ambiente online. Isso inclui dependências, configuração e verificação antes da publicação.", "cards": [["Qual a vantagem de empacotar a aplicação em container?", "O ambiente de execução fica reproduzível."], ["O que a integração contínua deve verificar?", "Testes, análise estática e contratos relevantes antes de incorporar uma mudança."]], "chapter": [["heading", "Do computador de desenvolvimento ao ambiente online"], ["paragraph", "Uma API pode funcionar localmente porque depende de bibliotecas, arquivos e variáveis que já existem naquela máquina. Ao publicar, algumas dessas condições podem faltar. Uma imagem de container descreve o que precisa estar disponível no ambiente de execução e define como iniciar o serviço. A mesma imagem pode rodar em teste e em produção, recebendo configurações próprias para cada ambiente."], ["heading", "O que faz parte da imagem e o que vem de fora"], ["paragraph", "O código e as dependências vão na imagem. Segredos, URL do provedor e configurações que mudam entre ambientes entram no momento da execução. Um teste com um provedor simulado pode exercitar a rota do aplicativo sem chave real. Para distinguir uma API iniciada de uma API que nem subiu, um endpoint de saúde pode expor um sinal simples. A capacidade de responder a esse endpoint é diferente de garantir que o provedor externo está funcionando."], ["heading", "O pipeline verifica o que o consumidor espera"], ["paragraph", "Considere uma rota que sempre devolve uma mensagem de erro quando recebe entrada vazia. Um teste de contrato confere a forma da requisição e da resposta, incluindo status e campos do JSON. Se uma alteração troca um nome de campo que o cliente usa, o teste pode falhar antes da publicação. Uma execução de integração contínua combina esses testes com verificações do código e da imagem. Depois da publicação, métricas de erro e tempo de resposta indicam como o serviço se comporta sob uso real."]]}, "laterTopics": [{"chapter": [["heading", "Controle a capacidade antes da saturação"], ["paragraph", "Se muitas pessoas fazem perguntas ao mesmo tempo, as chamadas externas podem esgotar a capacidade disponível. Limites por usuário reduzem o peso de uma única origem. Uma fila pode absorver parte do pico e trabalhar até o limite de concorrência escolhido. O timeout continua importante. Uma fila cheia de pedidos antigos pode dar a impressão de que a API funciona, enquanto ninguém recebe resposta em tempo útil."], ["heading", "Repetir uma chamada pode repetir o efeito"], ["paragraph", "Imagine que uma publicação chega ao servidor, é aplicada e perde a resposta no caminho de volta. Se o cliente tenta de novo, o destino precisa reconhecer a mesma operação. Uma chave de idempotência associa as tentativas a um único efeito. Para consultas de leitura, o risco de duplicar uma alteração é menor, mas as tentativas ainda gastam tempo e recursos. Limite o número de repetições e o tempo total."], ["heading", "Cache e versões precisam trabalhar juntos"], ["paragraph", "Um resultado em cache pode reduzir latência e custo. Se o regulamento mudou, uma resposta calculada com o índice antigo pode continuar aparecendo. Defina quando descartar o resultado e associe a chave do cache ao que influencia a resposta, como a versão do acervo e o escopo de acesso. Registrar versões de prompt, modelo e índice facilita descobrir qual combinação produziu um resultado incorreto."]], "references": [["https://sre.google/sre-book/monitoring-distributed-systems/", "Google SRE · saturação e demais sinais de operação"]]}, {"chapter": [["heading", "Estime o custo por unidade de uso"], ["paragraph", "Para 1.000 perguntas, estime quantos tokens vão para o modelo e quantos voltam. Multiplique os volumes pelas tarifas correspondentes e acrescente busca, indexação e infraestrutura. Se 1.000 pedidos usam em média 800 tokens de entrada, o volume de entrada é 800 mil tokens. Mantenha a unidade da tarifa explícita. Depois que a aplicação tiver uso real, troque as médias assumidas pelos volumes observados."], ["heading", "Observe a cauda do tempo de resposta"], ["paragraph", "A latência p95 indica aproximadamente o valor dentro do qual 95% dos pedidos terminaram. Se o p95 cresce enquanto a média quase não muda, um grupo de solicitações ficou mais lento. Compare os tempos de fila, busca e geração para localizar a origem. Acompanhe também a taxa de erro por categoria, porque um retorno rápido de falha pode mascarar um problema no indicador de latência."], ["heading", "Simule a indisponibilidade antes de precisar reagir"], ["paragraph", "Desative um provedor em um cenário de teste ou configure o adaptador para simular timeout. Confira se o sistema encerra a espera, informa a limitação e oferece um resultado alternativo que preserve os critérios do produto. Para uma aplicação de RAG, isso pode significar mostrar as fontes recuperadas sem inventar uma resposta. Registre como identificar a recuperação do serviço e quando voltar ao caminho normal."]], "references": [["https://sre.google/sre-book/monitoring-distributed-systems/", "Google SRE · métricas de latência e erros do serviço"]]}]}, {"id": "12", "slug": "12-projeto-final", "title": "Projeto final: assistente de documentação", "hours": "16 h", "phase": "Produção", "goal": "Demonstração: testes, avaliação antes/depois, análise de risco, deploy demonstrável e relatório de decisão sobre fine tuning.", "deliverable": "Entregar aplicativo funcional que responde com fontes, diz quando não sabe e consulta um catálogo via MCP.", "steps": [["Planejar o assistente", "Escolha documentos públicos ou autorizados, descreva quem pode consultar cada um e defina jornadas: perguntar, encontrar fonte e revisar resposta. Escreva critérios de aceite para resposta citada, ausência de evidência e consulta ao catálogo. Estabeleça um orçamento e limites de acesso.", "“Quando não houver trecho pertinente, responder sem inventar e oferecer consulta às fontes”."], ["Integrar componentes", "Construa API e interface; indexe documentos e recupere trechos com metadados e citação. Exponha uma consulta de catálogo por MCP; use um grafo para triagem, busca, revisão humana quando necessária e resposta. Cada componente deve ter uma responsabilidade verificável.", "Pergunta → filtro de acesso → busca → avaliação de evidência → resposta citada ou revisão."], ["Demonstrar e avaliar", "Execute 30 perguntas fixas, incluindo casos adversariais e sem resposta. Mostre métricas antes e depois de uma alteração, explique falhas e demonstre retomada, custos e limitações. Registre por que fine tuning ajudaria ou não neste problema.", "Entregue aplicação executável, tabela de resultados, diagrama e demonstração curta."]], "videos": [{"title": "RAG do zero, revisão", "url": "https://www.youtube.com/watch?v=sVcwVQRHIc8", "id": "sVcwVQRHIc8", "stage": 1, "script": "Percorra o assistente final: documento, indexação, pergunta, trecho, citação e resposta. Demonstre a ausência de evidência e relate um erro encontrado no conjunto de avaliação."}, {"title": "LangGraph, revisão", "url": "https://www.youtube.com/watch?v=4iYOJ6gyQV4", "id": "4iYOJ6gyQV4", "stage": 1, "script": "Mostre a mesma pergunta no grafo: triagem, busca, revisão e resposta. Explique estado, rota condicional e checkpoint, e registre quando uma pessoa precisa aprovar o próximo passo."}], "exercises": ["Entregar aplicativo funcional que responde com fontes, diz quando não sabe e consulta um catálogo via MCP.", "Incluir 30 perguntas de avaliação, relatório de métricas, vídeo curto de demonstração e diagrama da arquitetura."], "qa": [["Qual é a evidência de que a resposta está fundamentada?", "Citação verificável de trecho pertinente."], ["Qual função do MCP no projeto?", "Expor a capacidade de consultar um catálogo ao agente."], ["Onde entra LangGraph?", "No fluxo com estados, rotas e revisão humana."], ["Que resultado justifica fine tuning?", "Ganho medido em comportamento-alvo frente a alternativas mais simples."], ["Que entregáveis permitem reproduzir a avaliação?", "Dataset de testes autorizado, rubrica, configuração e resultados."], ["Qual é o comportamento quando faltam fontes?", "Informar a limitação e não inventar conteúdo."]], "criteria": "A entrega deve funcionar de forma reproduzível; inclua evidência de execução e explique um erro encontrado. Nos módulos sem integração paga, use dados de teste ou mocks.", "refs": ["https://docs.langchain.com/oss/python/langgraph/overview", "https://modelcontextprotocol.io/docs/learn/architecture"], "firstTopic": {"context": "O projeto final reúne os componentes da trilha em um assistente de documentação. O primeiro passo é escolher um acervo e definir o que uma demonstração precisa provar.", "cards": [["Como demonstrar que uma resposta está fundamentada?", "Mostrando uma citação verificável de um trecho que sustenta a resposta."], ["O que definir antes de escolher documentos para o projeto?", "Quem vai usar o assistente e quais documentos essas pessoas podem consultar."]], "chapter": [["heading", "Delimitar o que o assistente precisa resolver"], ["paragraph", "Considere um assistente que atende pessoas novas em um projeto e responde com base em um manual e um catálogo. Essa escolha define uma audiência, um acervo e um tipo de pergunta. Antes de integrar ferramentas ou publicar uma interface, vale identificar se os manuais podem ser usados e quais partes só determinados usuários podem consultar. Essas regras determinam quais trechos entram na busca e podem ser mostrados."], ["heading", "Três perguntas revelam três fluxos"], ["paragraph", "“Qual é o prazo de solicitação?” pode ser respondida com uma citação do manual. “O manual diz quando o prazo muda em feriados?” pode exigir uma indicação de que não há fonte suficiente. “Qual item tem o código A1?” usa a consulta do catálogo. Cada cenário define um comportamento diferente que a demonstração precisa mostrar. O primeiro depende de busca, o segundo depende de reconhecer limites e o terceiro depende do contrato com uma ferramenta."], ["heading", "Critérios que viram evidência na demonstração"], ["paragraph", "Para o primeiro fluxo, um critério pode exigir que a resposta identifique a seção exata que sustenta o prazo. Para o segundo, que informe a falta de evidência quando os documentos não cobrem feriados. Para o terceiro, que devolva o item certo e trate códigos inexistentes. Esses critérios podem formar o começo da avaliação. Quando a aplicação integra os componentes no tópico seguinte, os mesmos cenários ajudam a localizar se um erro veio da busca, do controle de acesso, do catálogo ou da geração do texto."]]}, "laterTopics": [{"chapter": [["heading", "Cada camada responde por uma parte"], ["paragraph", "A interface coleta a pergunta e mostra a resposta. A API autentica a pessoa e valida a entrada. O mecanismo de busca recebe o escopo autorizado e devolve trechos com identificadores e fontes. O modelo recebe o material permitido e elabora a resposta. Se uma informação não chega à interface, essa divisão permite conferir em qual etapa ela se perdeu."], ["heading", "O grafo coordena a evidência e a revisão"], ["paragraph", "Uma pergunta sobre prazo entra pelo nó de triagem. A busca encontra a seção da política. A avaliação verifica se o trecho cobre a pergunta. Quando a evidência basta, a geração produz uma resposta com fonte. Se o caso exige revisão, o fluxo pode pausar com a pergunta, os trechos e a proposta já registrados. Uma pergunta sobre o código A1 pode seguir outro caminho e consultar a ferramenta do catálogo por MCP."], ["heading", "Verifique os contratos antes de unir tudo"], ["paragraph", "Teste a busca com uma pergunta e um trecho conhecidos. Verifique se o catálogo devolve A1 e trata um código inexistente. Depois rode o cenário da interface até o resultado e confira que as fontes exibidas correspondem ao que saiu da busca. Se um teste de ponta a ponta falha, os testes de cada componente ajudam a isolar se o problema está na recuperação, no contrato da ferramenta ou na forma como a resposta foi apresentada."]], "references": [["https://docs.langchain.com/oss/python/langgraph/overview", "LangGraph · estado e coordenação do fluxo"], ["https://modelcontextprotocol.io/docs/learn/architecture", "MCP · integração com a ferramenta de catálogo"]]}, {"chapter": [["heading", "Uma demonstração precisa de casos reproduzíveis"], ["paragraph", "Monte 30 perguntas fixas com respostas esperadas, fontes e casos sem evidência. Inclua perguntas que precisam passar pela ferramenta e perguntas que a identidade de teste não tem permissão para responder. Use dados permitidos para a demonstração e anote a versão do acervo e da aplicação. Assim outra pessoa consegue repetir o ensaio e verificar de onde saiu cada resultado."], ["heading", "Compare o antes e o depois por tipo de erro"], ["paragraph", "Execute o mesmo conjunto em duas versões. Se a segunda responde melhor a perguntas de prazo e pior a consultas de catálogo, a média pode esconder a troca. Separe acerto da resposta, qualidade da citação e comportamento em casos sem evidência. Mostre um caso completo, incluindo os trechos recuperados e o motivo de seguir pela resposta direta ou pela revisão humana."], ["heading", "Demonstre o que acontece quando algo falha"], ["paragraph", "Durante a demonstração, simule um retorno de busca vazio ou uma ferramenta indisponível. Mostre a mensagem ao usuário, o que aparece no registro e se a execução pode ser retomada. Termine com custos observados, limitações conhecidas e a decisão sobre o próximo investimento. Se os erros vêm de fontes ausentes, melhorar a cobertura do acervo é uma ação mais diretamente ligada ao resultado que testar ajustes de estilo."]], "references": [["https://docs.langchain.com/langsmith/evaluation", "LangSmith · conjuntos de teste e comparação de versões"]]}]}]</script>
<script>
"use strict";

const course = JSON.parse(document.getElementById("course").textContent);
const app = document.getElementById("app");
const posterLabels = [
  "Python", "Git diff", "Prompt", "POST", "RAG", "tools()", "MCP",
  "graph()", "Agents", "trace()", "LoRA", "deploy", "ship()"
];
const palettes = [
  ["#30213b", "#9a567a", "#ffd2ee"],
  ["#242445", "#535ea0", "#dfdfff"],
  ["#362320", "#9a503d", "#ffdabd"],
  ["#14343b", "#377b81", "#d1f6ef"],
  ["#39213a", "#8c506c", "#ffd4ee"],
  ["#252d44", "#4e6398", "#dce7ff"]
];
const phases = [...new Set(course.map(module => module.phase))];

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[char]);
}

function colors(id) {
  const [base, glow, tint] = palettes[Number(id) % palettes.length];
  return '--base:' + base + ';--glow:' + glow + ';--tint:' + tint;
}

function moduleCard(module) {
  return '<a class="tile" href="#' + module.id + '">' +
    '<div class="poster" aria-hidden="true" style="' + colors(module.id) + '">' +
      '<small>' + module.id + '</small><span>' + posterLabels[Number(module.id)] + '</span>' +
    '</div><div class="tile-copy"><strong>' + escapeHtml(module.title) + '</strong>' +
    '<small>Módulo ' + module.id + ' · ' + escapeHtml(module.hours) + '</small></div></a>';
}

function matchText(value) {
  return value.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLowerCase().trim();
}

function showShelves(query = "") {
  const term = matchText(query);
  const matching = course.filter(module => matchText(
    [module.id, module.title, module.phase, ...module.steps.map(step => step[0])].join(" ")
  ).includes(term));
  const shelves = phases.map(phase => {
    const modules = matching.filter(module => module.phase === phase);
    if (!modules.length) return "";
    return '<section class="shelf"><h3>' + phase + '</h3><div class="cards">' +
      modules.map(moduleCard).join("") + '</div></section>';
  });
  document.getElementById("shelves").innerHTML = shelves.join("") ||
    '<p class="empty" role="status">Nenhum módulo encontrado.</p>';
}

function renderHome() {
  document.title = "Aplicação real de IA · Trilha de estudos";
  app.innerHTML = [
    '<section class="hero"><div class="container hero-inner">',
    '<div class="hero-copy"><p class="eyebrow">Trilha de estudos · 13 módulos</p>',
    '<h1>Engenharia de<br>software <span>com IA</span></h1>',
    '<p class="description">De Python ao assistente de documentação. Estude por vídeo ou leitura e pratique a cada módulo.</p>',
    '<div class="actions"><a class="button primary" href="#00">Começar pelo módulo 00</a>',
    '<a class="button" href="#catalogo">Explorar módulos</a></div></div>',
    '<div class="art" aria-hidden="true"><p><strong>01</strong> &nbsp; aprender(python)</p>',
    '<p><strong>02</strong> &nbsp; construir(assistente)</p>',
    '<p><strong>03</strong> &nbsp; avaliar(respostas)</p><p>▰ ▰ ▰</p></div></div></section>',
    '<section class="container catalog" id="catalogo">',
    '<div class="catalog-head"><h2 tabindex="-1">Catálogo de módulos</h2>',
    '<div class="search"><label for="query">Buscar módulo</label>',
    '<input id="query" type="search" placeholder="Ex.: Python, MCP, RAG"></div></div>',
    '<div id="shelves"></div></section>'
  ].join("");
  document.getElementById("query").addEventListener("input", event => showShelves(event.target.value));
  showShelves();
}

function videoBlock(video, showScript = true) {
  const videoId = encodeURIComponent(video.id);
  const watch = "https://www.youtube.com/watch?v=" + videoId;
  // A página publicada envia a origem HTTPS. Arquivos locais não enviam esse referer.
  const canEmbed = location.protocol === "https:" || location.protocol === "http:";
  const title = escapeHtml(video.title);
  const player = canEmbed
    ? '<iframe title="Vídeo: ' + title + '" loading="lazy" ' +
      'src="https://www.youtube-nocookie.com/embed/' + videoId + '" ' +
      'referrerpolicy="strict-origin-when-cross-origin" ' +
      'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" ' +
      'allowfullscreen></iframe>'
    : '';
  const link = '<a class="' + (canEmbed ? 'video-fallback' : 'button primary') +
    '" href="' + watch + '" target="_blank" rel="noopener noreferrer">' +
    (canEmbed ? 'Abrir no YouTube ↗' : 'Assistir no YouTube ↗') + '</a>';
  const card = '<div class="watch-card"><h4>' + title + '</h4>' + player + link + '</div>';
  if (!showScript) return '<div class="topic-video">' + card + '</div>';
  return '<div class="video-block">' + card +
    '<div class="script"><h3>Roteiro de leitura</h3><p>' +
    escapeHtml(video.script) + '</p></div></div>';
}


function readingLink(url) {
  const { hostname } = new URL(url);
  const parts = new URL(url).pathname.split("/").filter(Boolean);
  const suffix = parts.length ? " · " + parts.slice(-2).join(" / ").replaceAll("-", " ") : "";
  return '<li><a class="reference" target="_blank" rel="noopener noreferrer" href="' +
    escapeHtml(url) + '">' + escapeHtml(hostname + suffix) + '</a></li>';
}

function renderChapter(blocks) {
  return '<div class="chapter">' + blocks.map(([kind, content]) => {
    const value = escapeHtml(content);
    if (kind === "heading") return '<h4>' + value + '</h4>';
    if (kind === "code") return '<pre><code>' + value + '</code></pre>';
    return '<p>' + value + '</p>';
  }).join("") + '</div>';
}

function renderFirstTopic(module, videos, introductoryVideo) {
  const [title] = module.steps[0];
  const topic = module.firstTopic;
  const scripts = videos.map(video => '<p><strong>' + escapeHtml(video.title) + '</strong> · ' +
    escapeHtml(video.script) + '</p>').join("");
  return '<section class="section" id="topico-1"><h2 tabindex="-1">1. ' + escapeHtml(title) + '</h2>' +
    '<div class="topic-part"><h3>Contexto</h3><p>' + escapeHtml(topic.context) + '</p></div>' +
    '<div class="topic-part"><h3>Vídeos</h3>' +
    (introductoryVideo ? '<p class="muted">O vídeo apresenta este tema e antecipa a aplicação nos próximos tópicos.</p>' : '') +
    videos.map(video => videoBlock(video, false)).join("") + '</div>' +
    '<div class="topic-part topic-reading"><h3>Leitura do tópico</h3>' +
    renderChapter(topic.chapter) +
    '<h4>Leitura de apoio</h4><ul>' + module.refs.map(readingLink).join("") + '</ul>' +
    '<details><summary>Roteiro de leitura dos vídeos</summary>' + scripts + '</details></div>' +
    '<button class="button primary flash-open" type="button" id="open-flashcards">Ver flashcards</button>' +
    '<dialog class="flash-dialog" id="flashcards" aria-labelledby="flash-title">' +
    '<div class="flash-head"><h3 id="flash-title">Flashcards · Tópico 1</h3>' +
    '<form method="dialog"><button class="button" autofocus>Fechar</button></form></div>' +
    '<p class="flash-progress muted" id="card-progress"></p>' +
    '<div class="flash-card" aria-live="polite"><p id="card-question"></p><p class="flash-answer" id="card-answer" hidden></p></div>' +
    '<div class="flash-controls"><button class="button" type="button" id="card-prev">Anterior</button>' +
    '<button class="button primary" type="button" id="card-reveal" aria-controls="card-answer" aria-expanded="false">Mostrar resposta</button>' +
    '<button class="button" type="button" id="card-next">Próximo</button></div></dialog></section>';
}

function wireFlashcards(cards) {
  const get = id => document.getElementById(id);
  const dialog = get("flashcards");
  const open = get("open-flashcards");
  const previous = get("card-prev");
  const next = get("card-next");
  const reveal = get("card-reveal");
  const answer = get("card-answer");
  let index = 0;

  function showAnswer(visible) {
    answer.hidden = !visible;
    reveal.setAttribute("aria-expanded", String(visible));
    reveal.textContent = visible ? "Ocultar resposta" : "Mostrar resposta";
  }

  function renderCard() {
    const [question, response] = cards[index];
    get("card-progress").textContent = (index + 1) + " de " + cards.length;
    showAnswer(false);
    get("card-question").textContent = question;
    answer.textContent = response;
    previous.disabled = index === 0;
    next.disabled = index === cards.length - 1;
    if (document.activeElement === previous && previous.disabled) reveal.focus();
    if (document.activeElement === next && next.disabled) reveal.focus();
  }

  open.addEventListener("click", () => {
    index = 0;
    renderCard();
    dialog.showModal();
  });
  dialog.addEventListener("close", () => open.focus());
  previous.addEventListener("click", () => { index--; renderCard(); });
  next.addEventListener("click", () => { index++; renderCard(); });
  reveal.addEventListener("click", () => showAnswer(answer.hidden));
}

function renderLesson(module) {
  const index = course.indexOf(module);
  const previous = course[index - 1];
  const next = course[index + 1];
  const sectionLinks = module.steps.map((_, i) =>
    '<a class="button" href="#' + module.id + '/topico-' + (i + 1) + '">Tópico ' + (i + 1) + '</a>');
  const firstVideos = module.videos.filter(video => video.stage === 0);
  const introductoryVideo = firstVideos.length ? null : module.videos[0];
  const topics = module.steps.map(([title], i) => {
    if (i === 0) return renderFirstTopic(module, introductoryVideo ? [introductoryVideo] : firstVideos, introductoryVideo);
    const topic = module.laterTopics[i - 1];
    const videos = module.videos.filter(video => video.stage === i && video !== introductoryVideo)
      .map(video => videoBlock(video)).join("");
    const references = topic.references.map(([url, label]) =>
      '<li><a class="reference" target="_blank" rel="noopener noreferrer" href="' +
      escapeHtml(url) + '">' + escapeHtml(label) + '</a></li>').join("");
    return '<section class="section" id="topico-' + (i + 1) + '"><h2 tabindex="-1">' +
      (i + 1) + '. ' + escapeHtml(title) + '</h2>' +
      (videos ? '<div class="topic-part"><h3>Vídeos</h3>' + videos + '</div>' : '') +
      '<div class="topic-part topic-reading"><h3>Leitura do tópico</h3>' +
      renderChapter(topic.chapter) +
      '<h4>Leitura de apoio</h4><ul>' + references + '</ul></div></section>';
  }).join("");
  const tasks = module.exercises.map(exercise => '<li>' + escapeHtml(exercise) + '</li>').join("");
  const quiz = module.qa.map(([question, answer], i) => '<details><summary>' +
    (i + 1) + '. ' + escapeHtml(question) + '</summary><p>' + escapeHtml(answer) + '</p></details>').join("");
  document.title = "Módulo " + module.id + " · " + module.title;
  app.innerHTML = '<div class="container lesson"><a class="navlink" href="#catalogo">← Catálogo de módulos</a>' +
    '<header class="lesson-hero" style="' + colors(module.id) + '"><p class="eyebrow">' + escapeHtml(module.phase) +
    ' · Módulo ' + module.id + ' · ' + escapeHtml(module.hours) + '</p><h1>' + escapeHtml(module.title) +
    '</h1><p class="description">' + escapeHtml(module.goal) + '</p><p><strong>Entrega</strong> · ' +
    escapeHtml(module.deliverable) + '</p><a class="button" href="roteiros/Modulo_' + module.id +
    '.docx" download>Baixar roteiro em Word</a></header>' +
    '<nav class="lesson-menu" aria-label="Neste módulo">' + sectionLinks.join("") +
    '<a class="button" href="#' + module.id + '/pratica">Prática</a><a class="button" href="#' +
    module.id + '/revisao">Revisão</a></nav><div class="content">' + topics +
    '<section class="section" id="pratica"><h2 tabindex="-1">Prática guiada</h2><ol>' + tasks +
    '</ol><p>' + escapeHtml(module.criteria) + '</p></section>' +
    '<section class="section" id="revisao"><h2 tabindex="-1">Questões de revisão</h2>' + quiz + '</section>' +
    '</div>' +
    '<nav class="pager" aria-label="Ordem dos módulos">' +
    (previous ? '<a class="button" href="#' + previous.id + '">← Módulo ' + previous.id + '</a>' :
      '<a class="button" href="#catalogo">← Catálogo</a>') +
    (next ? '<a class="button primary" href="#' + next.id + '">Módulo ' + next.id + ' →</a>' :
      '<a class="button primary" href="#catalogo">Voltar ao catálogo</a>') + '</nav></div>';
  wireFlashcards(module.firstTopic.cards);
}

let activeView;
function route() {
  const [view, section] = location.hash.slice(1).split("/");
  const module = course.find(item => item.id === view);
  const page = module?.id ?? "home";
  if (activeView !== page) {
    if (module) renderLesson(module);
    else renderHome();
    activeView = page;
  }
  const target = document.getElementById(module ? section || "" : view === "catalogo" ? "catalogo" : "");
  if (target) {
    target.scrollIntoView();
    target.querySelector("h2")?.focus({preventScroll:true});
  } else {
    window.scrollTo(0, 0);
    if (location.hash) app.focus({preventScroll:true});
  }
}

window.addEventListener("hashchange", route);
route();
</script>
</body>
